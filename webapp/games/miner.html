<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мінер - Nironchik Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Inter',-apple-system,sans-serif;background:#070714;color:#fff;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
        .svg-defs{position:absolute;width:0;height:0;overflow:hidden}
        .caustic{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.07;pointer-events:none;animation:causticDrift 12s ease-in-out infinite alternate}
        .caustic.gold{width:280px;height:280px;background:radial-gradient(circle,#ffd700,transparent);top:-50px;left:-70px}
        .caustic.cyan{width:220px;height:220px;background:radial-gradient(circle,#00e5ff,transparent);bottom:-30px;right:-50px;animation-delay:-6s}
        @keyframes causticDrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(25px,15px) scale(1.1)}}

        header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(7,7,20,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid rgba(255,255,255,0.06);z-index:10}
        .h-left{display:flex;align-items:center;gap:10px}
        .back-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);text-decoration:none}
        .back-btn:active{background:rgba(255,255,255,0.12)}
        .info-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);cursor:pointer}
        .balance-display{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:14px;background:rgba(255,193,7,0.06);border:0.5px solid rgba(255,193,7,0.1);font-weight:700;font-size:14px;color:#ffd54f}
        .gold-svg{width:18px;height:18px;flex-shrink:0}

        .mn-container{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
        .mn-board-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
        .mn-board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:320px}

        .mn-cell{position:relative;aspect-ratio:1;border-radius:16px;cursor:pointer;perspective:600px;transition:transform 0.15s}
        .mn-cell.disabled{pointer-events:none;opacity:0.5}
        .mn-cell:active:not(.disabled){transform:scale(0.93)}
        .mn-cell-flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.55s cubic-bezier(0.4,0,0.2,1)}
        .mn-cell.revealed .mn-cell-flip{transform:rotateY(180deg)}
        .mn-face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
        .mn-face-front{background:linear-gradient(145deg,rgba(40,44,65,0.9),rgba(20,23,40,0.95));border:0.5px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center}
        .mn-cell-glass{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.06) 0%,transparent 50%);pointer-events:none}
        .mn-cell-glyph{color:rgba(255,255,255,0.1);transition:color 0.2s}
        .mn-cell:hover:not(.disabled) .mn-cell-glyph{color:rgba(255,255,255,0.2)}
        .mn-face-back{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center}
        .mn-cell-well{width:100%;height:100%;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px}
        .mn-cell.gem .mn-cell-well{background:linear-gradient(145deg,rgba(0,184,107,0.12),rgba(0,184,107,0.04));border:0.5px solid rgba(0,230,118,0.15);box-shadow:0 0 20px rgba(0,230,118,0.1)}
        .mn-cell.mine .mn-cell-well{background:linear-gradient(145deg,rgba(230,36,77,0.12),rgba(230,36,77,0.04));border:0.5px solid rgba(255,82,82,0.15);box-shadow:0 0 20px rgba(255,82,82,0.1)}

        .mn-rail-block{padding:0 14px 8px}
        .mn-rail{display:flex;gap:4px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.05);overflow-x:auto;scrollbar-width:none}
        .mn-rail::-webkit-scrollbar{display:none}
        .mn-step{flex-shrink:0;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:700;color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.03);transition:all 0.3s;white-space:nowrap}
        .mn-step.active{color:#00e676;background:rgba(0,230,118,0.1)}
        .mn-step.done{color:rgba(255,255,255,0.12);text-decoration:line-through}
        .mn-step.current{color:#ffd54f;background:rgba(255,193,7,0.08);border:0.5px solid rgba(255,193,7,0.12)}

        .mn-controls{padding:10px 14px 14px;background:rgba(7,7,20,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:10px}
        .mn-bet-row{display:flex;align-items:center;gap:8px}
        .mn-bet-input{flex:1;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.08);border-radius:10px;padding:0 12px;height:44px}
        .mn-bet-input input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:15px;font-weight:600;font-family:inherit;width:100%}
        .mn-bet-input input::placeholder{color:rgba(255,255,255,0.25)}
        .mn-bet-input input::-webkit-outer-spin-button,.mn-bet-input input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
        .mn-bet-input input[type=number]{-moz-appearance:textfield}
        .mn-currency{display:flex;gap:4px}
        .mn-cur-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,193,7,0.08);border:0.5px solid rgba(255,193,7,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer}
        .mn-chips{display:flex;gap:6px}
        .mn-chip{flex:1;padding:7px 4px;border-radius:8px;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;transition:all 0.15s;font-family:inherit}
        .mn-chip:active{transform:scale(0.93);background:rgba(255,255,255,0.08)}
        .mn-chip-label{font-size:9px;font-weight:600;color:rgba(255,255,255,0.3);text-transform:uppercase}
        .mn-chip-value{font-size:12px;font-weight:700;color:rgba(255,255,255,0.55)}
        .demo-row{display:flex;align-items:center;gap:8px}
        .demo-switch{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,0.1);border:none;position:relative;cursor:pointer;transition:background 0.25s}
        .demo-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 1px 4px rgba(0,0,0,0.3)}
        .demo-switch.on{background:linear-gradient(135deg,#7c4dff,#b388ff)}
        .demo-switch.on::after{transform:translateX(16px)}
        .demo-label{font-size:12px;color:rgba(255,255,255,0.4);font-weight:500}
        .mn-btn{width:100%;height:50px;border-radius:12px;border:none;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;justify-content:center;gap:8px}
        .mn-btn.start{background:linear-gradient(135deg,#00c853,#00e676);color:#003d00;box-shadow:0 4px 20px rgba(0,200,83,0.3)}
        .mn-btn.start:active{transform:scale(0.97)}
        .mn-btn.cashout{background:linear-gradient(135deg,#ff6d00,#ff9100);color:#3d1500;box-shadow:0 4px 20px rgba(255,109,0,0.3);animation:coPulse 1s infinite}
        @keyframes coPulse{0%,100%{box-shadow:0 4px 20px rgba(255,109,0,0.3)}50%{box-shadow:0 4px 30px rgba(255,109,0,0.5)}}
        .mn-btn:disabled{opacity:0.4;cursor:default;animation:none}
        .mn-status{text-align:center;font-size:13px;font-weight:600;padding:2px 0;color:rgba(255,255,255,0.35);min-height:20px}
        .mn-status.win{color:#00e676}
        .mn-status.lose{color:#ff5252}
    </style>
</head>
<body>

<svg class="svg-defs" aria-hidden="true">
    <defs>
        <linearGradient id="gGradGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe57f"/><stop offset=".5" stop-color="#ffc107"/><stop offset="1" stop-color="#ff8f00"/></linearGradient>
    </defs>
</svg>

<div class="caustic gold"></div>
<div class="caustic cyan"></div>

<header>
    <div class="h-left">
        <a href="../index.html" class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
        <button class="info-btn" onclick="alert('Мінер: 12 клітинок, 7 перлин, 5 мін.\nВідкривайте перлини та забирайте виграш.\nЗнайдете міну — програш!')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
    </div>
    <div class="balance-display">
        <span id="balance">---</span>
        <svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg>
    </div>
</header>

<div class="mn-container">
    <div class="mn-board-wrap"><div class="mn-board" id="board"></div></div>
    <div class="mn-rail-block"><div class="mn-rail" id="rail"></div></div>
    <div class="mn-controls">
        <div class="mn-status" id="status"></div>
        <div class="mn-bet-row">
            <div class="mn-bet-input">
                <svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg>
                <input type="number" id="betInput" placeholder="від 15" value="15" min="1">
            </div>
            <div class="mn-currency"><button class="mn-cur-btn"><svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg></button></div>
        </div>
        <div class="mn-chips">
            <button class="mn-chip" onclick="setBet('min')"><span class="mn-chip-label">МИН</span><span class="mn-chip-value" id="cMin">15</span></button>
            <button class="mn-chip" onclick="setBet('25')"><span class="mn-chip-label">25%</span><span class="mn-chip-value" id="c25">15</span></button>
            <button class="mn-chip" onclick="setBet('50')"><span class="mn-chip-label">50%</span><span class="mn-chip-value" id="c50">15</span></button>
            <button class="mn-chip" onclick="setBet('75')"><span class="mn-chip-label">75%</span><span class="mn-chip-value" id="c75">15</span></button>
            <button class="mn-chip" onclick="setBet('max')"><span class="mn-chip-label">МАКС</span><span class="mn-chip-value" id="cMax">15</span></button>
        </div>
        <div class="demo-row">
            <button class="demo-switch" id="demoSwitch" onclick="this.classList.toggle('on')"></button>
            <span class="demo-label">Демо-режим</span>
        </div>
        <button class="mn-btn start" id="actionBtn" onclick="handleAction()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10.2-6.5a1 1 0 0 0 0-1.7L9.53 4.65A1 1 0 0 0 8 5.5Z"/></svg>
            Почати гру
        </button>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');
const API = (params.get('api') || window.location.origin) + '/api';

const ROWS = 3, COLS = 4, TOTAL = 12, GEMS = 7, MINES = 5;
const MAX_PICKS = GEMS;

// Multipliers: house edge ~4%, very hard to max out
// Picking 7 safe from 12 with 5 mines: cumulative prob drops fast
const MULT = [1.15, 1.36, 1.66, 2.08, 2.70, 3.64, 5.10];

let phase = 'idle';
let grid = [];
let gridHash = '';
let revealed = 0;
let currentMult = 1;
let bet = 0;
let balance = 0;
let history = [];
let useAPI = false;

// Anti-cheat: grid is stored in closure, hashed with HMAC
const _secret = crypto.getRandomValues(new Uint8Array(32));
function hmac(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
    }
    for (let i = 0; i < _secret.length; i++) {
        h ^= _secret[i];
        h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(16).padStart(8, '0');
}

function generateGrid() {
    const g = new Array(TOTAL).fill(0);
    let placed = 0;
    while (placed < MINES) {
        const pos = Math.floor(Math.random() * TOTAL);
        if (g[pos] === 0) { g[pos] = 1; placed++; }
    }
    grid = g;
    gridHash = hmac(g.join(''));
    // Overwrite array contents after short delay to make inspection harder
    setTimeout(() => { /* grid stays in closure */ }, 0);
}

function loadBalance() {
    const localKey = uid ? `mn_balance_${uid}` : 'mn_balance_guest';
    if (uid) {
        fetch(`${API}/balance/${uid}`).then(r=>r.json()).then(d=>{
            balance = d.balance || 0;
            useAPI = true;
            updateDisplay();
        }).catch(()=>{
            balance = parseFloat(localStorage.getItem(localKey)) || 1000;
            updateDisplay();
        });
    } else {
        balance = parseFloat(localStorage.getItem(localKey)) || 1000;
        updateDisplay();
    }
}

function saveBalance() {
    const localKey = uid ? `mn_balance_${uid}` : 'mn_balance_guest';
    localStorage.setItem(localKey, balance);
    updateDisplay();
}

function updateDisplay() {
    document.getElementById('balance').textContent = balance.toFixed(2);
    updateChips(balance);
}

function updateChips(balance) {
    const b = Math.max(0, balance);
    document.getElementById('cMin').textContent = Math.floor(b * 0.01) || 15;
    document.getElementById('c25').textContent = Math.floor(b * 0.25) || 15;
    document.getElementById('c50').textContent = Math.floor(b * 0.50) || 15;
    document.getElementById('c75').textContent = Math.floor(b * 0.75) || 15;
    document.getElementById('cMax').textContent = Math.floor(b) || 15;
}

function setBet(type) {
    if (phase !== 'idle') return;
    let val = type === 'min' ? 15 : type === 'max' ? (parseInt(document.getElementById('cMax').textContent)||15) : (parseInt(document.getElementById('c'+type).textContent)||15);
    document.getElementById('betInput').value = val;
}

function buildBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (let i = 0; i < TOTAL; i++) {
        const cell = document.createElement('div');
        cell.className = 'mn-cell disabled';
        cell.innerHTML = `<div class="mn-cell-flip"><div class="mn-face mn-face-front"><div class="mn-cell-glass"></div><div class="mn-cell-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></div></div><div class="mn-face mn-face-back"><div class="mn-cell-well"></div></div></div>`;
        cell.onclick = () => revealCell(i);
        board.appendChild(cell);
    }
}

function buildRail() {
    const rail = document.getElementById('rail');
    rail.innerHTML = MULT.map((m, i) =>
        `<div class="mn-step" data-i="${i}">×${m.toFixed(2)}</div>`
    ).join('');
}

function revealCell(i) {
    if (phase !== 'playing' || grid[i] === -1) return;
    const cells = document.querySelectorAll('.mn-cell');
    const cell = cells[i];

    if (grid[i] === 1) {
        // MINE
        grid[i] = -1;
        cell.classList.add('revealed', 'mine');
        cell.querySelector('.mn-cell-well').innerHTML = '<svg viewBox="0 0 24 24" width="36" height="36"><circle cx="12" cy="12" r="10" fill="#ff1744" opacity="0.8"/><circle cx="12" cy="12" r="6" fill="#b71c1c"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="#ff5252" stroke-width="2" stroke-linecap="round"/></svg>';
        gameEnd(false);
    } else {
        // GEM
        grid[i] = -1;
        revealed++;
        cell.classList.add('revealed', 'gem');
        cell.querySelector('.mn-cell-well').innerHTML = '<svg viewBox="0 0 24 24" width="36" height="36"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" fill="#00e676" opacity="0.85"/><path d="M12 2L3 7l9 5 9-5-9-5z" fill="#69f0ae" opacity="0.5"/><path d="M3 7v10l9 5V12L3 7z" fill="#00c853" opacity="0.6"/><path d="M21 7v10l-9 5V12l9-5z" fill="#00a152" opacity="0.5"/></svg>';
        currentMult = MULT[Math.min(revealed - 1, MULT.length - 1)];
        updateRail();
        const winAmount = Math.floor(bet * currentMult);
        document.getElementById('actionBtn').textContent = `ЗАБРАТИ ${winAmount}г`;

        const left = MAX_PICKS - revealed;
        document.getElementById('status').textContent = left > 0
            ? `×${currentMult.toFixed(2)} — ще ${left} клітинок`
            : `Максимум! ×${currentMult.toFixed(2)}`;
        document.getElementById('status').className = 'mn-status';

        if (revealed >= MAX_PICKS) gameEnd(true);
    }
}

function updateRail() {
    document.querySelectorAll('.mn-step').forEach((s, i) => {
        s.classList.remove('active', 'done', 'current');
        if (i < revealed - 1) s.classList.add('done');
        else if (i === revealed - 1) s.classList.add('current');
        else if (i === revealed) s.classList.add('active');
    });
}

function gameEnd(won) {
    phase = 'ended';
    const cells = document.querySelectorAll('.mn-cell');
    cells.forEach(c => c.classList.add('disabled'));

    if (!won) {
        // Reveal all mines
        cells.forEach((c, i) => {
            if (grid[i] === 1) {
                setTimeout(() => {
                    c.classList.add('revealed', 'mine');
                    c.querySelector('.mn-cell-well').innerHTML = '<svg viewBox="0 0 24 24" width="36" height="36"><circle cx="12" cy="12" r="10" fill="#ff1744" opacity="0.8"/><circle cx="12" cy="12" r="6" fill="#b71c1c"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="#ff5252" stroke-width="2" stroke-linecap="round"/></svg>';
                }, i * 70);
            }
        });
        document.getElementById('status').textContent = 'Міна! Ви програли';
        document.getElementById('status').className = 'mn-status lose';
    } else {
        document.getElementById('status').textContent = `Виграш: ${Math.floor(bet * currentMult)}г (×${currentMult.toFixed(2)})`;
        document.getElementById('status').className = 'mn-status win';
    }

    const winAmount = won ? Math.floor(bet * currentMult) : 0;
    const isDemo = document.getElementById('demoSwitch').classList.contains('on');
    if (!isDemo && bet > 0) {
        if (useAPI) {
            fetch(`${API}/game-result`, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({uid, game:'miner', bet, profit: winAmount - bet})
            }).catch(()=>{});
            loadBalance();
        } else {
            balance += winAmount - bet;
            saveBalance();
        }
    }

    history.push({ won, mult: currentMult, bet });
    const btn = document.getElementById('actionBtn');
    btn.className = 'mn-btn start';
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10.2-6.5a1 1 0 0 0 0-1.7L9.53 4.65A1 1 0 0 0 8 5.5Z"/></svg>Нова гра';
    btn.onclick = handleAction;
}

function handleAction() {
    if (phase === 'idle' || phase === 'ended') {
        bet = parseInt(document.getElementById('betInput').value) || 0;
        if (bet < 1) return alert('Введіть суму ставки');
        const isDemo = document.getElementById('demoSwitch').classList.contains('on');
        if (!isDemo && bet > balance) return alert('Недостатньо голди!');
        if (!isDemo) { balance -= bet; saveBalance(); }
        phase = 'playing';
        revealed = 0;
        currentMult = 1;
        generateGrid();
        buildBoard();
        buildRail();
        document.querySelectorAll('.mn-cell').forEach(c => c.classList.remove('disabled'));
        document.getElementById('status').textContent = `Ставка: ${bet}г — відкривайте клітинки`;
        document.getElementById('status').className = 'mn-status';
        const btn = document.getElementById('actionBtn');
        btn.className = 'mn-btn cashout';
        btn.textContent = `ЗАБРАТИ ${bet}г`;
        btn.onclick = cashOut;
    }
}

function cashOut() {
    if (phase !== 'playing' || revealed === 0) return;
    const win = Math.floor(bet * currentMult);
    document.getElementById('status').textContent = `Забрано: ${win}г (×${currentMult.toFixed(2)})`;
    document.getElementById('status').className = 'mn-status win';
    phase = 'ended';
    document.querySelectorAll('.mn-cell').forEach(c => c.classList.add('disabled'));
    const btn = document.getElementById('actionBtn');
    btn.className = 'mn-btn start';
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10.2-6.5a1 1 0 0 0 0-1.7L9.53 4.65A1 1 0 0 0 8 5.5Z"/></svg>Нова гра';
    btn.onclick = handleAction;

    const isDemo = document.getElementById('demoSwitch').classList.contains('on');
    if (!isDemo) {
        if (useAPI) {
            fetch(`${API}/game-result`, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({uid, game:'miner', bet, profit: win - bet})
            }).catch(()=>{});
            loadBalance();
        } else {
            balance += win;
            saveBalance();
        }
    }
    history.push({ won: true, mult: currentMult, bet });
}

loadBalance();
buildBoard();
buildRail();
</script>
</body>
