<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Башня - Nironchik Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Inter',-apple-system,sans-serif;background:#070714;color:#fff;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}

        header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(7,7,20,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid rgba(255,255,255,0.06);z-index:10}
        .back-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);text-decoration:none}
        .back-btn:active{background:rgba(255,255,255,0.12)}
        .title{font-size:16px;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,#ffd54f,#ff8f00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .h-right{display:flex;align-items:center;gap:8px}
        .info-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);cursor:pointer}
        .balance-chip{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:14px;background:rgba(255,193,7,0.06);border:0.5px solid rgba(255,193,7,0.1);font-weight:700;font-size:14px;color:#ffd54f}
        .gold-svg{width:16px;height:16px;flex-shrink:0}

        .max-win{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;margin:8px 14px;border-radius:10px;background:rgba(255,193,7,0.05);border:0.5px solid rgba(255,193,7,0.08);font-size:12px;font-weight:600;color:rgba(255,255,255,0.4)}
        .max-win span{color:#ffd54f;font-weight:800}

        .board-area{flex:1;display:flex;align-items:center;justify-content:center;padding:0 10px;overflow:hidden}
        .grid{display:flex;flex-direction:column-reverse;gap:4px;width:100%;max-width:300px}
        .vj-row{display:flex;align-items:center;gap:6px;opacity:0.3;transition:all 0.3s}
        .vj-row.active{opacity:1}
        .vj-row.done{opacity:0.45}
        .vj-row.locked{opacity:0.15;pointer-events:none}
        .vj-row-num{width:22px;text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,0.2);flex-shrink:0}
        .vj-row.active .vj-row-num{color:#ffd54f}
        .vj-tiles{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex:1}
        .vj-tile{position:relative;border-radius:8px;border:none;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.06);padding:8px 4px;min-height:38px}
        .vj-row.active .vj-tile{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.08)}
        .vj-row.active .vj-tile:hover{background:rgba(255,255,255,0.1);transform:scale(1.03)}
        .vj-row.active .vj-tile:active{transform:scale(0.95)}
        .vj-tile-prize{font-size:12px;font-weight:700;color:rgba(255,255,255,0.5);transition:color 0.2s}
        .vj-row.active .vj-tile-prize{color:rgba(255,255,255,0.6)}
        .vj-tile.safe{background:rgba(0,230,118,0.12)!important;border-color:rgba(0,230,118,0.2)!important}
        .vj-tile.safe .vj-tile-prize{color:#00e676!important}
        .vj-tile.mine{background:rgba(255,23,68,0.12)!important;border-color:rgba(255,23,68,0.2)!important}
        .vj-tile.mine .vj-tile-prize{color:#ff5252!important}
        .vj-tile.revealed{pointer-events:none}
        .vj-row.done .vj-tile{pointer-events:none}

        .controls{padding:10px 14px 14px;background:rgba(7,7,20,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:10px}
        .ctrl-top{display:flex;align-items:flex-end;gap:10px}
        .input-grp{flex:1;display:flex;flex-direction:column;gap:4px}
        .label{font-size:11px;font-weight:600;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.5px}
        .input-box{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.08);border-radius:8px;padding:0 10px;height:38px}
        .input-box input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14px;font-weight:600;font-family:inherit}

        .demo-row{display:flex;align-items:center;gap:8px}
        .demo-switch{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,0.1);border:none;position:relative;cursor:pointer;transition:background 0.25s}
        .demo-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 1px 4px rgba(0,0,0,0.3)}
        .demo-switch.on{background:linear-gradient(135deg,#7c4dff,#b388ff)}
        .demo-switch.on::after{transform:translateX(16px)}
        .demo-label{font-size:12px;color:rgba(255,255,255,0.4);font-weight:500}

        .action-btn{width:100%;height:48px;border-radius:10px;border:none;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.25s;letter-spacing:0.5px}
        .action-btn.play{background:linear-gradient(135deg,#00c853,#00e676);color:#003d00;box-shadow:0 4px 16px rgba(0,200,83,0.3)}
        .action-btn.play:active{transform:scale(0.97)}
        .action-btn.cashout{background:linear-gradient(135deg,#ff6d00,#ff9100);color:#3d1500;box-shadow:0 4px 16px rgba(255,109,0,0.3);animation:coPulse 1s infinite}
        @keyframes coPulse{0%,100%{box-shadow:0 4px 16px rgba(255,109,0,0.3)}50%{box-shadow:0 4px 24px rgba(255,109,0,0.5)}}
        .action-btn:disabled{opacity:0.4;cursor:default;animation:none}
        .status{text-align:center;font-size:13px;font-weight:600;padding:2px 0;color:rgba(255,255,255,0.35);min-height:20px}
        .status.win{color:#00e676}
        .status.lose{color:#ff5252}
    </style>
</head>
<body>

<svg style="position:absolute;width:0;height:0"><defs><linearGradient id="gGradGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe57f"/><stop offset=".5" stop-color="#ffc107"/><stop offset="1" stop-color="#ff8f00"/></linearGradient></defs></svg>

<header>
    <a href="../games.html" class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <div class="title">БАШНЯ</div>
    <div class="h-right">
        <button class="info-btn" onclick="alert('Башня: 9 рядів, 2 клітинки.\nОберіть правильну клітинку щоб піднятись вгору.\nВиграш подвоюється з кожним рядком.\nМаксимум ×512 від ставки.')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
        <div class="balance-chip"><span id="balance">---</span><svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg></div>
    </div>
</header>

<div class="max-win">МАКСИМАЛЬНИЙ ВИГРАШ: <span id="maxWin">---</span><svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg></div>

<div class="board-area"><div class="grid" id="grid"></div></div>

<div class="controls">
    <div class="status" id="status"></div>
    <div class="ctrl-top">
        <div class="input-grp">
            <span class="label">Ставка</span>
            <div class="input-box">
                <svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg>
                <input type="number" id="betInput" value="15" min="1">
            </div>
        </div>
    </div>
    <div class="demo-row">
        <button class="demo-switch" id="demoSwitch" onclick="this.classList.toggle('on')"></button>
        <span class="demo-label">Демо-режим</span>
    </div>
    <button class="action-btn play" id="actionBtn" onclick="handleAction()">ГРАТИ</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');
const API = (params.get('api') || window.location.origin) + '/api';

const ROWS = 9;
const MULT = 1.87; // per row: 1.87^9 ≈ 512x
let balance = 0, phase = 'idle', grid = [], currentRow = 0, bet = 0;

function loadBalance() {
    const k = uid ? `vej_balance_${uid}` : 'vej_balance_guest';
    if (uid) {
        fetch(`${API}/balance/${uid}`).then(r=>r.json()).then(d=>{
            balance = d.balance||0; updateBal();
        }).catch(()=>{ balance = parseFloat(localStorage.getItem(k))||1000; updateBal(); });
    } else { balance = parseFloat(localStorage.getItem(k))||1000; updateBal(); }
}
function saveBalance() {
    const k = uid ? `vej_balance_${uid}` : 'vej_balance_guest';
    localStorage.setItem(k, balance); updateBal();
}
function updateBal() { document.getElementById('balance').textContent = balance.toFixed(2); }

function rowMult(r) {
    let m = 1;
    for (let i = 0; i <= r; i++) m *= MULT;
    return Math.round(m);
}
function rowPrize(r) {
    const b = parseInt(document.getElementById('betInput').value) || 15;
    return Math.floor(b * rowMult(r));
}

function updateMaxWin() {
    const b = parseInt(document.getElementById('betInput').value) || 15;
    document.getElementById('maxWin').textContent = Math.floor(b * rowMult(ROWS - 1)).toLocaleString() + 'G';
}
document.getElementById('betInput').addEventListener('input', updateMaxWin);

function buildGrid() {
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';
    grid = [];
    for (let r = 0; r < ROWS; r++) {
        const correct = Math.random() < 0.5 ? 0 : 1;
        const prize = rowPrize(r);
        const row = document.createElement('div');
        row.className = 'vj-row' + (r === 0 ? ' active' : ' locked');
        row.id = `row${r}`;
        row.innerHTML = `<div class="vj-row-num">${r+1}</div><div class="vj-tiles"><button class="vj-tile"><div class="vj-tile-prize">+${prize.toLocaleString()}G</div></button><button class="vj-tile"><div class="vj-tile-prize">+${prize.toLocaleString()}G</div></button></div>`;
        const tiles = row.querySelectorAll('.vj-tile');
        tiles[0].onclick = () => pickTile(r, 0);
        tiles[1].onclick = () => pickTile(r, 1);
        gridEl.appendChild(row);
        grid.push({ correct, prize, revealed: false });
    }
}

function pickTile(r, c) {
    if (phase !== 'playing' || r !== currentRow) return;
    const row = grid[r];
    const tiles = document.querySelectorAll(`#row${r} .vj-tile`);
    const tile = tiles[c];

    row.revealed = true;

    if (c === row.correct) {
        tile.classList.add('safe', 'revealed');
        tile.querySelector('.vj-tile-prize').textContent = '✓';
        currentRow++;

        document.getElementById('status').textContent = `Ряд ${currentRow}/${ROWS} — ×${rowMult(currentRow-1)}`;
        document.getElementById('status').className = 'status';

        if (currentRow < ROWS) {
            document.getElementById(`row${currentRow}`).className = 'vj-row active';
        }
        document.getElementById(`row${r}`).className = 'vj-row done';

        if (currentRow >= ROWS) gameEnd(true);
    } else {
        tile.classList.add('mine', 'revealed');
        tile.querySelector('.vj-tile-prize').textContent = '✕';
        tiles[1 - c].classList.add('safe', 'revealed');
        tiles[1 - c].querySelector('.vj-tile-prize').textContent = '✓';
        gameEnd(false);
    }
}

function gameEnd(won) {
    phase = 'ended';
    const winAmount = won ? rowPrize(ROWS - 1) : 0;
    const isDemo = document.getElementById('demoSwitch').classList.contains('on');

    for (let r = currentRow; r < ROWS; r++) {
        const rowEl = document.getElementById(`row${r}`);
        const tiles = rowEl.querySelectorAll('.vj-tile');
        if (!grid[r].revealed) {
            grid[r].revealed = true;
            tiles[grid[r].correct].classList.add('safe', 'revealed');
            tiles[grid[r].correct].querySelector('.vj-tile-prize').textContent = '✓';
            tiles[1 - grid[r].correct].classList.add('mine', 'revealed');
            tiles[1 - grid[r].correct].querySelector('.vj-tile-prize').textContent = '✕';
        }
        rowEl.className = 'vj-row done';
    }

    if (won) {
        document.getElementById('status').textContent = `Виграш: ${winAmount.toLocaleString()}г (×${rowMult(ROWS-1)})`;
        document.getElementById('status').className = 'status win';
    } else {
        document.getElementById('status').textContent = 'Неправильно! Ви програли';
        document.getElementById('status').className = 'status lose';
    }

    if (!isDemo && bet > 0) {
        if (uid) {
            fetch(`${API}/game-result`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({uid, game:'vejha', bet, profit: winAmount - bet})
            }).catch(()=>{});
            loadBalance();
        } else {
            balance += winAmount - bet;
            saveBalance();
        }
    }

    const btn = document.getElementById('actionBtn');
    btn.className = 'action-btn play';
    btn.textContent = 'НОВА ГРА';
    btn.disabled = false;
}

function handleAction() {
    if (phase === 'idle' || phase === 'ended') {
        bet = parseInt(document.getElementById('betInput').value) || 0;
        if (bet <= 0) return alert('Введіть суму ставки');
        const isDemo = document.getElementById('demoSwitch').classList.contains('on');
        if (!isDemo && bet > balance) return alert('Недостатньо голди!');
        if (!isDemo) { balance -= bet; saveBalance(); }
        phase = 'playing';
        currentRow = 0;
        document.getElementById('status').textContent = `Ряд 1/${ROWS} — оберіть клітинку`;
        document.getElementById('status').className = 'status';
        buildGrid();
        const btn = document.getElementById('actionBtn');
        btn.className = 'action-btn cashout';
        btn.textContent = 'ЗАБРАТИ';
        btn.onclick = cashOut;
    }
}

function cashOut() {
    if (phase !== 'playing' || currentRow === 0) return;
    const win = rowPrize(currentRow - 1);
    phase = 'ended';
    document.getElementById('status').textContent = `Забрано: ${win.toLocaleString()}г (×${rowMult(currentRow - 1)})`;
    document.getElementById('status').className = 'status win';

    const isDemo = document.getElementById('demoSwitch').classList.contains('on');
    if (!isDemo) {
        if (uid) {
            fetch(`${API}/game-result`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({uid, game:'vejha', bet, profit: win - bet})
            }).catch(()=>{});
            loadBalance();
        } else {
            balance += win;
            saveBalance();
        }
    }

    for (let r = currentRow; r < ROWS; r++) {
        const rowEl = document.getElementById(`row${r}`);
        const tiles = rowEl.querySelectorAll('.vj-tile');
        if (!grid[r].revealed) {
            grid[r].revealed = true;
            tiles[grid[r].correct].classList.add('safe', 'revealed');
            tiles[grid[r].correct].querySelector('.vj-tile-prize').textContent = '✓';
            tiles[1 - grid[r].correct].classList.add('mine', 'revealed');
            tiles[1 - grid[r].correct].querySelector('.vj-tile-prize').textContent = '✕';
        }
        rowEl.className = 'vj-row done';
    }

    const btn = document.getElementById('actionBtn');
    btn.className = 'action-btn play';
    btn.textContent = 'НОВА ГРА';
    btn.onclick = handleAction;
}

loadBalance();
buildGrid();
updateMaxWin();
</script>
</body>
</html>
