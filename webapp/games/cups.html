<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Стаканчики - Nironchik Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Inter',-apple-system,sans-serif;background:#070714;color:#fff;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}

        header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(7,7,20,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid rgba(255,255,255,0.06);z-index:10}
        .back-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);text-decoration:none}
        .back-btn:active{background:rgba(255,255,255,0.12)}
        .title{font-size:16px;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,#ffd54f,#ff8f00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .h-right{display:flex;align-items:center;gap:8px}
        .info-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);cursor:pointer}
        .balance-chip{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:14px;background:rgba(255,193,7,0.06);border:0.5px solid rgba(255,193,7,0.1);font-weight:700;font-size:14px;color:#ffd54f}
        .gold-svg{width:16px;height:16px;flex-shrink:0}

        .scene{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at center bottom,rgba(30,20,60,0.6),transparent 70%)}
        .hint{font-size:13px;font-weight:500;color:rgba(255,255,255,0.25);margin-bottom:8px;text-align:center;max-width:280px}
        .stage{position:relative;width:300px;height:160px;margin-bottom:30px}
        .shadow{position:absolute;width:56px;height:8px;border-radius:50%;background:rgba(0,0,0,0.4);filter:blur(8px);bottom:2px;transform:translateX(-50%);transition:left 0.5s ease,z-index 0s}
        .shadow.hidden{opacity:0}
        .cup{position:absolute;width:60px;height:80px;border:none;cursor:pointer;transition:all 0.5s ease;transform:translateX(-50%);background:none;display:flex;align-items:flex-end;justify-content:center;z-index:2}
        .cup:disabled{cursor:default}
        .cup-body{width:56px;height:68px;border-radius:8px 8px 14px 14px;background:linear-gradient(180deg,#3a3a5c 0%,#2a2a44 100%);border:1px solid rgba(255,255,255,0.08);box-shadow:0 8px 24px rgba(0,0,0,0.5);position:relative;display:flex;align-items:center;justify-content:center;transition:transform 0.15s}
        .cup:hover .cup-body{transform:translateY(-6px)}
        .cup:active .cup-body{transform:translateY(-12px)}
        .cup-body::before{content:'';position:absolute;top:-5px;left:3px;right:3px;height:6px;border-radius:3px 3px 0 0;background:rgba(255,255,255,0.06)}
        .cup-lip{position:absolute;top:-2px;left:-4px;right:-4px;height:5px;border-radius:3px;background:rgba(255,255,255,0.1)}
        .ball{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6b6b,#d32f2f);position:absolute;bottom:-2px;opacity:0;transition:opacity 0.3s;box-shadow:0 2px 8px rgba(211,47,47,0.4)}
        .ball.fake{background:radial-gradient(circle at 35% 35%,#ffcdd2,#f44336);box-shadow:0 2px 8px rgba(244,67,54,0.4)}
        .cup.show-ball .ball{opacity:1}
        .cup.won .cup-body{border-color:rgba(0,230,118,0.4);box-shadow:0 0 20px rgba(0,230,118,0.3)}
        .cup.lost .cup-body{border-color:rgba(255,23,68,0.3);box-shadow:0 0 12px rgba(255,23,68,0.2)}
        .cup.peeked .cup-body{opacity:0.5}
        .cup.disabled-peek{opacity:0.4;cursor:not-allowed}
        .cup.disabled-peek .cup-body{border-color:rgba:255,23,68,0.2)}

        .panel{padding:10px 14px 14px;background:rgba(7,7,20,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:10px}

        .stats{display:flex;gap:8px}
        .stat{flex:1;padding:8px;border-radius:8px;background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.06);text-align:center}
        .stat-title{font-size:10px;font-weight:600;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
        .stat-val{font-size:16px;font-weight:800;color:#fff}
        .stat-val.gold{color:#ffd54f}

        .bet-row{display:flex;align-items:center;gap:6px;margin:4px 0}
        .step-btn{width:36px;height:36px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
        .step-btn:active{transform:scale(0.9)}
        .bet-input-wrap{flex:1;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.08);border-radius:8px;padding:0 10px;height:36px}
        .bet-input-wrap input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14px;font-weight:600;font-family:inherit;text-align:center}

        .presets{display:flex;gap:4px;margin-top:4px}
        .preset{flex:1;padding:6px;border-radius:6px;border:0.5px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.4);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s}
        .preset:active{transform:scale(0.93)}

        .peek-btn{width:100%;height:36px;border-radius:8px;border:0.5px solid rgba(255,193,7,0.2);background:rgba(255,193,7,0.08);color:#ffd54f;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.15s;margin:4px 0}
        .peek-btn:hover{background:rgba(255,193,7,0.12)}
        .peek-btn:active{transform:scale(0.97)}
        .peek-btn:disabled{opacity:0.3;cursor:default}

        .cta-btn{width:100%;height:44px;border-radius:10px;border:none;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition-all 0.2s;letter-spacing:0.5px}
        .cta-btn.play{background:linear-gradient(135deg,#00c853,#00e676);color:#003d00;box-shadow:0 4px 16px rgba(0,200,83,0.3)}
        .cta-btn.play:active{transform:scale(0.97)}
        .cta-btn:disabled{opacity:0.4;cursor:default}

        .demo-row{display:flex;align-items:center;gap:8px;margin-top:4px}
        .demo-switch{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,0.1);border:none;position:relative;cursor:pointer;transition:background 0.25s}
        .demo-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 1px 4px rgba(0,0,0,0.3)}
        .demo-switch.on{background:linear-gradient(135deg,#7c4dff,#b388ff)}
        .demo-switch.on::after{transform:translateX(16px)}
        .demo-label{font-size:12px;color:rgba(255,255,255,0.4);font-weight:500}

        .status{text-align:center;font-size:12px;font-weight:600;padding:0 0 2px;color:rgba(255,255,255,0.3);min-height:18px}
        .status.win{color:#00e676}
        .status.lose{color:#ff5252}
    </style>
</head>
<body>

<svg style="position:absolute;width:0;height:0"><defs><linearGradient id="gGradGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe57f"/><stop offset=".5" stop-color="#ffc107"/><stop offset="1" stop-color="#ff8f00"/></linearGradient></defs></svg>

<header>
    <a href="../index.html" class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <div class="title">СТАКАНЧИКИ</div>
    <div class="h-right">
        <button class="info-btn" onclick="alert('Стаканчики: 4 стакани, один має кульку.\nСтакани перемішуються — оберіть правильний.\nМножник ×3.20\n\nМожна розглянути стакан за 5г — відкриє порожній стакан.\nДивися увагою — не обманеш!')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
        <div class="balance-chip"><span id="balance">---</span><svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg></div>
    </div>
</header>

<div class="scene">
    <div class="hint" id="hint">Вгадай, який стакан містить кульку</div>
    <div class="stage" id="stage">
        <div class="shadow" id="s0" style="left:75px"></div>
        <div class="shadow" id="s1" style="left:150px"></div>
        <div class="shadow" id="s2" style="left:225px"></div>
        <div class="shadow" id="s3" style="left:300px"></div>
        <button class="cup" id="cup0" style="left:75px;bottom:12px" onclick="pickCup(0)"><div class="cup-body"><div class="cup-lip"></div><div class="ball"></div></div></button>
        <button class="cup" id="cup1" style="left:150px;bottom:28px" onclick="pickCup(1)"><div class="cup-body"><div class="cup-lip"></div><div class="ball"></div></div></button>
        <button class="cup" id="cup2" style="left:225px;bottom:12px" onclick="pickCup(2)"><div class="cup-body"><div class="cup-lip"></div><div class="ball"></div></div></button>
        <button class="cup" id="cup3" style="left:300px;bottom:40px" onclick="pickCup(3)"><div class="cup-body"><div class="cup-lip"></div><div class="ball"></div></div></button>
    </div>
</div>

<svg style="position:absolute;width:0;height:0"><defs><linearGradient id="gGradGold2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe57f"/><stop offset=".5" stop-color="#ffc107"/><stop offset="1" stop-color="#ff8f00"/></linearGradient></defs></svg>

<div class="panel">
    <div class="stats">
        <div class="stat"><div class="stat-title">Множник</div><div class="stat-val">×3.20</div></div>
        <div class="stat"><div class="stat-title">Виграш</div><div class="stat-val gold" id="potential">48</div></div>
    </div>
    <div class="bet-row">
        <button class="step-btn" onclick="stepBet(-5)">–</button>
        <div class="bet-input-wrap">
            <svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg>
            <input type="number" id="betInput" value="15" min="1" oninput="updatePotential()">
        </div>
        <button class="step-btn" onclick="stepBet(5)">+</button>
    </div>
    <div class="presets">
        <button class="preset" onclick="setBet(15)">Мін</button>
        <button class="preset" onclick="halfBet()">½</button>
        <button class="preset" onclick="doubleBet()">×2</button>
        <button class="preset" onclick="maxBet()">Макс</button>
    </div>
    <button class="peek-btn" id="peekBtn" onclick="peek()" disabled>👁 Розглянути за 5г</button>
    <button class="cta-btn play" id="ctaBtn" onclick="handleAction()">Грати за 15</button>
    <div class="demo-row">
        <button class="demo-switch" id="demoSwitch" onclick="this.classList.toggle('on');updatePotential()"></button>
        <span class="demo-label">Демо-режим</span>
    </div>
    <div class="status" id="status"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');
const API = (params.get('api') || window.location.origin) + '/api';
const MULT = 3.2;
const CUPS = 4;
const PEEK_COST = 5;
const POSITIONS = [75,150,225,300];
const BOTTOMS = [12,28,12,40];
let balance = 0, phase = 'idle', ballPos = 0, bet = 15, peeked = [];

function loadBalance() {
    const k = uid ? `cups_balance_${uid}` : 'cups_balance_guest';
    if (uid) {
        fetch(`${API}/balance/${uid}`).then(r=>r.json()).then(d=>{
            balance = d.balance||0; updateBal();
        }).catch(()=>{ balance = parseFloat(localStorage.getItem(k))||1000; updateBal(); });
    } else { balance = parseFloat(localStorage.getItem(k))||1000; updateBal(); }
}
function saveBalance() {
    const k = uid ? `cups_balance_${uid}` : 'cups_balance_guest';
    localStorage.setItem(k, balance); updateBal();
}
function updateBal() { document.getElementById('balance').textContent = balance.toFixed(2); }

function updatePotential() {
    const b = parseInt(document.getElementById('betInput').value) || 0;
    document.getElementById('potential').textContent = Math.floor(b * MULT).toLocaleString();
    document.getElementById('ctaBtn').textContent = `Грати за ${b}`;
}
document.getElementById('betInput').addEventListener('input', updatePotential);

function stepBet(delta) {
    const inp = document.getElementById('betInput');
    let v = (parseInt(inp.value) || 15) + delta;
    if (v < 1) v = 1;
    inp.value = v;
    updatePotential();
}
function setBet(v) { document.getElementById('betInput').value = v; updatePotential(); }
function halfBet() { const b = parseInt(document.getElementById('betInput').value)||15; document.getElementById('betInput').value = Math.max(1,Math.floor(b/2)); updatePotential(); }
function doubleBet() { const b = parseInt(document.getElementById('betInput').value)||15; document.getElementById('betInput').value = b*2; updatePotential(); }
function maxBet() { document.getElementById('betInput').value = Math.floor(balance); updatePotential(); }

function resetCups() {
    for (let i = 0; i < CUPS; i++) {
        const c = document.getElementById(`cup${i}`);
        c.className = 'cup';
        c.disabled = true;
        c.style.left = POSITIONS[i] + 'px';
        c.style.bottom = BOTTOMS[i] + 'px';
        c.querySelector('.ball').style.opacity = '0';
        document.getElementById(`s${i}`).classList.remove('hidden');
    }
    peeked = [];
    document.getElementById('peekBtn').disabled = false;
}

function showBall(pos) {
    const cup = document.getElementById(`cup${pos}`);
    const ball = cup.querySelector('.ball');
    ball.classList.remove('fake');
    ball.style.opacity = '1';
}

function hideBall(pos) {
    document.getElementById(`cup${pos}`).querySelector('.ball').style.opacity = '0';
}

function peek() {
    if (phase !== 'choosing' || peeked.length >= CUPS - 1) return;
    const isDemo = document.getElementById('demoSwitch').classList.contains('on');
    const available = [];
    for (let i = 0; i < CUPS; i++) {
        if (i !== ballPos && !peeked.includes(i) && !document.getElementById(`cup${i}`).classList.contains('peeked')) {
            available.push(i);
        }
    }
    if (available.length === 0) return;
    const target = available[Math.floor(Math.random() * available.length)];
    peeked.push(target);

    const cup = document.getElementById(`cup${target}`);
    cup.classList.add('peeked');
    const ball = cup.querySelector('.ball');
    ball.classList.add('fake');
    ball.style.opacity = '1';

    document.getElementById('status').textContent = `Розглянуто стакан ${target + 1} — порожній`;
    document.getElementById('status').className = 'status';

    if (!isDemo) {
        balance -= PEEK_COST;
        saveBalance();
    }
    updatePeekBtn();
}

function updatePeekBtn() {
    const isDemo = document.getElementById('demoSwitch').classList.contains('on');
    const btn = document.getElementById('peekBtn');
    if (phase !== 'choosing') { btn.disabled = true; btn.textContent = '👁 Розглянути за 5г'; return; }
    const remaining = CUPS - 1 - peeked.length;
    if (isDemo) {
        btn.disabled = false;
        btn.textContent = `👁 Розглянути (${remaining} залишилось)`;
        return;
    }
    if (balance < PEEK_COST) { btn.disabled = true; btn.textContent = '👁 Недостатньо голди'; }
    else { btn.disabled = false; btn.textContent = `👁 Розглянути за ${PEEK_COST}г (${remaining})`; }
}

async function shuffleCups() {
    const cupEls = [0,1,2,3].map(i => document.getElementById(`cup${i}`));
    const shadowEls = [0,1,2,3].map(i => document.getElementById(`s${i}`));
    let positions = [...POSITIONS];
    let bottoms = [...BOTTOMS];

    const swaps = 8;
    for (let s = 0; s < swaps; s++) {
        await new Promise(r => setTimeout(r, 250));
        let a = Math.floor(Math.random() * CUPS);
        let b; do { b = Math.floor(Math.random() * CUPS); } while (b === a);

        const tmpP = positions[a]; positions[a] = positions[b]; positions[b] = tmpP;
        const tmpB = bottoms[a]; bottoms[a] = bottoms[b]; bottoms[b] = tmpB;

        for (let i = 0; i < CUPS; i++) {
            cupEls[i].style.left = positions[i] + 'px';
            cupEls[i].style.bottom = bottoms[i] + 'px';
            shadowEls[i].style.left = positions[i] + 'px';
        }
    }
}

function pickCup(i) {
    if (phase !== 'choosing') return;
    phase = 'reveal';
    for (let j = 0; j < CUPS; j++) document.getElementById(`cup${j}`).disabled = true;
    document.getElementById('peekBtn').disabled = true;

    // Reveal all
    for (let j = 0; j < CUPS; j++) {
        const ball = document.getElementById(`cup${j}`).querySelector('.ball');
        ball.classList.remove('fake');
        ball.style.opacity = '1';
    }

    const won = i === ballPos;
    document.getElementById(`cup${ballPos}`).classList.add('won');
    if (!won) document.getElementById(`cup${i}`).classList.add('lost');

    const st = document.getElementById('status');
    const isDemo = document.getElementById('demoSwitch').classList.contains('on');

    if (won) {
        const winAmount = Math.floor(bet * MULT);
        st.textContent = `Виграш: ${winAmount}г (×${MULT.toFixed(2)})`;
        st.className = 'status win';
        if (!isDemo) { balance += winAmount; saveBalance(); }
    } else {
        st.textContent = `Програш: -${bet}г (куля була у стакані ${ballPos + 1})`;
        st.className = 'status lose';
    }

    if (!isDemo && uid) {
        fetch(`${API}/game-result`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({uid, game:'cups', bet, profit: won ? Math.floor(bet * MULT) - bet : -bet})
        }).catch(()=>{});
    }

    document.getElementById('hint').textContent = 'Натисніть "Грати" знову';
    const btn = document.getElementById('ctaBtn');
    btn.className = 'cta-btn play';
    btn.textContent = 'НОВА ГРА';
    btn.disabled = false;
    phase = 'ended';
}

async function handleAction() {
    if (phase === 'idle' || phase === 'ended') {
        bet = parseInt(document.getElementById('betInput').value) || 0;
        if (bet <= 0) return alert('Введіть суму ставки');
        const isDemo = document.getElementById('demoSwitch').classList.contains('on');
        if (!isDemo && bet > balance) return alert('Недостатньо голди!');
        if (!isDemo) { balance -= bet; saveBalance(); }

        phase = 'shuffle';
        ballPos = Math.floor(Math.random() * CUPS);
        peeked = [];
        const btn = document.getElementById('ctaBtn');
        btn.disabled = true;
        btn.textContent = 'ШУКАЄМО...';
        document.getElementById('status').textContent = '';
        document.getElementById('status').className = 'status';
        document.getElementById('hint').textContent = 'Стакани перемішуються...';

        resetCups();
        await new Promise(r => setTimeout(r, 200));
        showBall(ballPos);
        await new Promise(r => setTimeout(r, 600));
        hideBall(ballPos);
        await shuffleCups();

        phase = 'choosing';
        document.getElementById('hint').textContent = 'Оберіть стакан з кулькою!';
        document.getElementById('peekBtn').disabled = false;
        updatePeekBtn();
        for (let i = 0; i < CUPS; i++) document.getElementById(`cup${i}`).disabled = false;
    }
}

loadBalance();
updatePotential();
</script>
</body>
</html>
