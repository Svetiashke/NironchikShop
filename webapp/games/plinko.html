<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Плинко - Nironchik Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Inter',-apple-system,sans-serif;background:#070714;color:#fff;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
        .gold-svg{width:18px;height:18px;flex-shrink:0}

        header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(7,7,20,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid rgba(255,255,255,0.06);z-index:10}
        .back-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);text-decoration:none}
        .back-btn:active{background:rgba(255,255,255,0.12)}
        .title{font-size:18px;font-weight:800;letter-spacing:3px;background:linear-gradient(135deg,#ffd54f,#ff8f00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .info-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);cursor:pointer;margin-right:10px}
        .balance-chip{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:14px;background:rgba(255,193,7,0.06);border:0.5px solid rgba(255,193,7,0.1);font-weight:700;font-size:14px;color:#ffd54f}

        .content{flex:1;display:flex;flex-direction:column;overflow:hidden}
        .board-area{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#070714,#0d0d2a,#070714)}
        .board-area canvas{display:block;width:100%;height:100%}

        .mult-row{display:flex;padding:0 4px 6px;gap:3px;justify-content:center}
        .mult-cell{flex:1;padding:6px 2px;border-radius:6px;text-align:center;font-size:11px;font-weight:800;min-width:0}
        .slot-red{background:rgba(255,23,68,0.2);color:#ff5252;border:0.5px solid rgba(255,23,68,0.2)}
        .slot-orange{background:rgba(255,152,0,0.15);color:#ffa726;border:0.5px solid rgba(255,152,0,0.15)}
        .slot-yellow{background:rgba(255,235,59,0.12);color:#ffee58;border:0.5px solid rgba(255,235,59,0.1)}
        .slot-green{background:rgba(0,230,118,0.1);color:#69f0ae;border:0.5px solid rgba(0,230,118,0.1)}
        .slot-green-dark{background:rgba(0,200,83,0.15);color:#00e676;border:0.5px solid rgba(0,200,83,0.12)}

        .controls{padding:10px 14px 14px;background:rgba(7,7,20,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:10px}
        .top-row{display:flex;align-items:center;gap:8px}
        .risk-section{display:flex;align-items:center;gap:6px;flex:1}
        .risk-label{font-size:11px;color:rgba(255,255,255,0.35);font-weight:500;white-space:nowrap}
        .risk-btns{display:flex;gap:4px}
        .risk-btn{padding:6px 12px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
        .risk-btn.active{background:rgba(0,200,83,0.12);color:#00e676;border-color:rgba(0,200,83,0.2)}
        .risk-btn.high-active{background:rgba(255,23,68,0.12);color:#ff5252;border-color:rgba(255,23,68,0.2)}
        .play-btn{padding:10px 28px;border-radius:10px;border:none;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#00c853,#00e676);color:#003d00;box-shadow:0 4px 16px rgba(0,200,83,0.3);transition:all 0.2s}
        .play-btn:active{transform:scale(0.95)}
        .play-btn:disabled{opacity:0.4;cursor:default}

        .bet-row{display:flex;align-items:center;gap:6px}
        .bet-edge{padding:6px 12px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
        .bet-adj{width:32px;height:32px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
        .bet-adj:active{background:rgba(255,255,255,0.1)}
        .bet-input-wrap{flex:1;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.08);border-radius:8px;padding:0 10px;height:36px}
        .bet-label{font-size:12px;color:rgba(255,255,255,0.35);white-space:nowrap}
        .bet-input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14px;font-weight:600;font-family:inherit;width:100%;text-align:center}
        .bet-input::-webkit-outer-spin-button,.bet-input::-webkit-inner-spin-button{-webkit-appearance:none}

        .demo-row{display:flex;align-items:center;gap:8px}
        .demo-switch{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,0.1);border:none;position:relative;cursor:pointer;transition:background 0.25s}
        .demo-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 1px 4px rgba(0,0,0,0.3)}
        .demo-switch.on{background:linear-gradient(135deg,#7c4dff,#b388ff)}
        .demo-switch.on::after{transform:translateX(16px)}
        .demo-label{font-size:12px;color:rgba(255,255,255,0.4);font-weight:500}

        .balance-row{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:rgba(255,255,255,0.5);padding-top:2px}
    </style>
</head>
<body>

<svg style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
        <linearGradient id="gGradGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe57f"/><stop offset=".5" stop-color="#ffc107"/><stop offset="1" stop-color="#ff8f00"/></linearGradient>
    </defs>
</svg>

<header>
    <a href="../index.html" class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <div class="title">PLINKO</div>
    <div style="display:flex;align-items:center">
        <button class="info-btn" onclick="alert('Плинко: кулька падає через шпильки та потрапляє в слот з множником!')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
        <div class="balance-chip"><span id="balance">---</span><svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg></div>
    </div>
</header>

<div class="content">
    <div class="board-area"><canvas id="canvas"></canvas></div>
    <div class="mult-row" id="multRow"></div>
    <div class="controls">
        <div class="top-row">
            <div class="risk-section">
                <span class="risk-label">Ризик:</span>
                <div class="risk-btns">
                    <button class="risk-btn" id="riskHigh" onclick="setRisk('high')">🔺 Високий</button>
                    <button class="risk-btn active" id="riskLow" onclick="setRisk('low')">🟢 Низький</button>
                </div>
            </div>
            <button class="play-btn" id="playBtn" onclick="drop()">ГРАТИ</button>
        </div>
        <div class="bet-row">
            <button class="bet-edge" onclick="setBet('min')">Мін</button>
            <button class="bet-adj" onclick="adjBet(-1)">−</button>
            <div class="bet-input-wrap">
                <span class="bet-label">Ставка:</span>
                <input type="number" id="betInput" value="15" min="1">
                <svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg>
            </div>
            <button class="bet-adj" onclick="adjBet(1)">+</button>
            <button class="bet-edge" onclick="setBet('max')">Макс</button>
        </div>
        <div class="demo-row">
            <button class="demo-switch" id="demoSwitch" onclick="this.classList.toggle('on')"></button>
            <span class="demo-label">Демо-режим</span>
        </div>
        <div class="balance-row">БАЛАНС <span id="balBottom">---</span> <svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg></div>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');
const API = (params.get('api') || window.location.origin) + '/api';

const ROWS = 12;
const MULTIPLIERS_LOW = [25,10,5,3,2,1.3,0.95,0.8,0.5,0.8,0.95,1.3,2,3,5,10,25];
const MULTIPLIERS_HIGH = [29,4,1.5,1.2,0.7,0.5,0.3,0.2,0.1,0.2,0.3,0.5,0.7,1.2,1.5,4,29];
const COLORS = {
    red:'rgba(255,23,68,0.25)', orange:'rgba(255,152,0,0.2)', yellow:'rgba(255,235,59,0.15)',
    green:'rgba(0,230,118,0.12)', dark:'rgba(0,200,83,0.18)'
};
const MULT_COLORS = ['red','orange','orange','yellow','yellow','green','green','green','dark','green','green','green','yellow','yellow','orange','orange','red'];

let balance = 0, risk = 'low', dropping = false;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let balls = [];
let pegs = [];
let dpr = 1;

function resize() {
    dpr = window.devicePixelRatio || 1;
    const w = canvas.parentElement.clientWidth;
    const h = canvas.parentElement.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.scale(dpr, dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    buildPegs(w, h);
}
window.addEventListener('resize', resize);

function buildPegs(w, h) {
    pegs = [];
    const rows = ROWS;
    const cols = rows + 2;
    const gapX = w / (cols + 1);
    const gapY = (h - 60) / rows;
    const startY = 30;
    for (let r = 0; r < rows; r++) {
        const count = r + 3;
        const rowWidth = (count - 1) * gapX;
        const startX = (w - rowWidth) / 2;
        for (let c = 0; c < count; c++) {
            pegs.push({ x: startX + c * gapX, y: startY + r * gapY, r: 3.5 });
        }
    }
}

function buildMultRow() {
    const muls = risk === 'low' ? MULTIPLIERS_LOW : MULTIPLIERS_HIGH;
    document.getElementById('multRow').innerHTML = muls.map((m, i) =>
        `<div class="mult-cell slot-${MULT_COLORS[i]}">${m}</div>`
    ).join('');
}

function setRisk(r) {
    risk = r;
    document.getElementById('riskHigh').className = r === 'high' ? 'risk-btn high-active' : 'risk-btn';
    document.getElementById('riskLow').className = r === 'low' ? 'risk-btn active' : 'risk-btn';
    buildMultRow();
}

function adjBet(d) {
    const inp = document.getElementById('betInput');
    let v = parseInt(inp.value) || 15;
    v = Math.max(1, v + d * Math.max(1, Math.floor(v * 0.1)));
    inp.value = v;
}

function setBet(type) {
    if (type === 'min') document.getElementById('betInput').value = 15;
    else document.getElementById('betInput').value = Math.floor(balance) || 15;
}

function loadBalance() {
    const localKey = uid ? `pl_balance_${uid}` : 'pl_balance_guest';
    if (uid) {
        fetch(`${API}/balance/${uid}`).then(r=>r.json()).then(d=>{
            balance = d.balance || 0;
            document.getElementById('balance').textContent = balance.toFixed(2);
            document.getElementById('balBottom').textContent = balance.toFixed(2);
        }).catch(()=>{
            balance = parseFloat(localStorage.getItem(localKey)) || 1000;
            updateBal();
        });
    } else {
        balance = parseFloat(localStorage.getItem(localKey)) || 1000;
        updateBal();
    }
}

function saveBalance() {
    const localKey = uid ? `pl_balance_${uid}` : 'pl_balance_guest';
    localStorage.setItem(localKey, balance);
    updateBal();
}

function updateBal() {
    document.getElementById('balance').textContent = balance.toFixed(2);
    document.getElementById('balBottom').textContent = balance.toFixed(2);
}

function drop() {
    if (dropping) return;
    const bet = parseInt(document.getElementById('betInput').value) || 0;
    if (bet <= 0) return;
    const isDemo = document.getElementById('demoSwitch').classList.contains('on');
    if (!isDemo && bet > balance) return alert('Недостатньо голди!');
    if (!isDemo) { balance -= bet; saveBalance(); }
    dropping = true;
    document.getElementById('playBtn').disabled = true;

    const w = canvas.width / dpr;
    const ball = {
        x: w / 2 + (Math.random() - 0.5) * 40,
        y: 10,
        vx: 0,
        vy: 2.5,
        bet: bet,
        isDemo: isDemo,
        trail: [],
        slot: -1
    };
    balls.push(ball);
}

function tick() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    ctx.clearRect(0, 0, w, h);

    // Draw pegs
    for (const p of pegs) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fill();
    }

    // Update & draw balls
    for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        b.vy += 0.12;
        b.x += b.vx;
        b.y += b.vy;
        b.vx *= 0.98;

        // Peg collisions
        for (const p of pegs) {
            const dx = b.x - p.x;
            const dy = b.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < p.r + 5 && b.vy > 0) {
                const angle = Math.atan2(dy, dx);
                const push = dx > 0 ? 1.8 : -1.8;
                b.vx += push;
                b.y = p.y + p.r + 6;
                b.vy *= 0.6;
                b.trail.push({ x: b.x, y: b.y, a: 1 });
            }
        }

        // Clamp
        if (b.x < 10) { b.x = 10; b.vx = Math.abs(b.vx); }
        if (b.x > w - 10) { b.x = w - 10; b.vx = -Math.abs(b.vx); }

        // Draw trail
        for (let t = b.trail.length - 1; t >= 0; t--) {
            b.trail[t].a -= 0.03;
            if (b.trail[t].a <= 0) { b.trail.splice(t, 1); continue; }
            ctx.beginPath();
            ctx.arc(b.trail[t].x, b.trail[t].y, 2, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0,230,118,${b.trail[t].a * 0.3})`;
            ctx.fill();
        }

        // Draw ball
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(b.x - 1, b.y - 1, 1, b.x, b.y, 5);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(0.4, '#00e676');
        grad.addColorStop(1, '#00a152');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.shadowColor = '#00e676';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Landed
        if (b.y > h - 30) {
            const muls = risk === 'low' ? MULTIPLIERS_LOW : MULTIPLIERS_HIGH;
            const slotW = w / muls.length;
            const slotIdx = Math.max(0, Math.min(muls.length - 1, Math.floor(b.x / slotW)));
            const mult = muls[slotIdx];
            const win = Math.floor(b.bet * mult);

            // Highlight slot
            const slotEls = document.querySelectorAll('.mult-cell');
            slotEls.forEach((el, idx) => {
                el.style.transition = 'none';
                el.style.transform = idx === slotIdx ? 'scale(1.15)' : '';
                el.style.filter = idx === slotIdx ? 'brightness(1.5)' : '';
            });
            setTimeout(() => slotEls.forEach(el => { el.style.transform = ''; el.style.filter = ''; }), 600);

            if (!b.isDemo) {
                balance += win;
                saveBalance();
                if (uid) {
                    fetch(`${API}/game-result`, {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({uid, game:'plinko', bet: b.bet, profit: win - b.bet})
                    }).catch(()=>{});
                }
            }

            balls.splice(i, 1);
            dropping = false;
            document.getElementById('playBtn').disabled = false;
        }
    }

    requestAnimationFrame(tick);
}

loadBalance();
buildMultRow();
resize();
tick();
</script>
</body>
</html>
