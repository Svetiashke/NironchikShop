<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Краш - NironchikShop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; user-select: none; }
        .header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; background: rgba(20, 20, 40, 0.9); }
        .back-btn { color: #fff; text-decoration: none; font-size: 20px; }
        .title { font-size: 18px; font-weight: bold; }
        .balance-badge { display: flex; align-items: center; gap: 4px; background: rgba(255, 193, 7, 0.15); padding: 6px 12px; border-radius: 16px; font-weight: bold; color: #ffc107; font-size: 13px; }
        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .crash-chart { width: 100%; max-width: 380px; height: 200px; background: rgba(255,255,255,0.03); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); position: relative; overflow: hidden; }
        .crash-canvas { width: 100%; height: 100%; }
        .multiplier-big { font-size: 64px; font-weight: 900; color: #00e676; text-shadow: 0 0 30px rgba(0,230,118,0.4); }
        .multiplier-big.crashed { color: #ff1744; text-shadow: 0 0 30px rgba(255,23,68,0.4); }
        .status-text { font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 8px; }
        .history-row { display: flex; gap: 6px; margin: 12px 0; flex-wrap: wrap; justify-content: center; }
        .history-pill { padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
        .history-pill.win { background: rgba(0,230,118,0.15); color: #00e676; }
        .history-pill.lose { background: rgba(255,23,68,0.15); color: #ff5252; }
        .controls { padding: 16px; display: flex; flex-direction: column; gap: 10px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
        .bet-row { display: flex; gap: 8px; }
        .bet-input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 14px 16px; color: #fff; font-size: 16px; font-weight: bold; outline: none; }
        .small-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 14px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
        .auto-cashout { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 10px 14px; border-radius: 12px; }
        .auto-cashout label { font-size: 13px; color: rgba(255,255,255,0.6); }
        .auto-cashout input { width: 60px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 6px 8px; color: #fff; font-size: 14px; font-weight: bold; outline: none; text-align: center; }
        .play-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: 800; cursor: pointer; color: #fff; background: linear-gradient(135deg, #00c853, #00e676); }
        .play-btn.cashout { background: linear-gradient(135deg, #ff9800, #ffc107); animation: pulse-btn 0.8s infinite; }
        .play-btn:active { transform: scale(0.97); }
        .play-btn:disabled { opacity: 0.4; }
        @keyframes pulse-btn { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,152,0,0.4); } 50% { box-shadow: 0 0 0 8px rgba(255,152,0,0); } }
        .win-popup, .loss-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 24px 40px; border-radius: 20px; font-size: 24px; font-weight: 900; z-index: 200; display: none; text-align: center; }
        .win-popup { background: rgba(0, 200, 83, 0.95); }
        .loss-popup { background: rgba(255, 23, 68, 0.95); }
        .win-popup.show, .loss-popup.show { display: block; animation: popIn 0.3s; }
        @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0.5); } 100% { transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body>
    <div class="header">
        <a href="../index.html" class="back-btn">←</a>
        <div class="title">📈 Краш</div>
        <div class="balance-badge" id="balance">🪙 0</div>
    </div>
    <div class="game-area">
        <div class="history-row" id="history"></div>
        <div class="crash-chart"><canvas class="crash-canvas" id="chart"></canvas></div>
        <div class="multiplier-big" id="multiplier">1.00x</div>
        <div class="status-text" id="status">Очікуємо раунд...</div>
    </div>
    <div class="controls">
        <div class="bet-row">
            <input type="number" class="bet-input" id="betInput" placeholder="Ставка" value="10" min="1">
            <button class="small-btn" onclick="halfBet()">½</button>
            <button class="small-btn" onclick="doubleBet()">2x</button>
        </div>
        <div class="auto-cashout">
            <label>Авто-забрати:</label>
            <input type="number" id="autoCashout" value="2.00" step="0.1" min="1.01">
            <span style="font-size:13px;color:rgba(255,255,255,0.4);">x</span>
        </div>
        <button class="play-btn" id="playBtn" onclick="handleClick()">Зробити ставку</button>
    </div>
    <div class="win-popup" id="winPopup"><div style="font-size:14px;opacity:0.8;margin-bottom:8px;">ВИГРАШ</div><div id="winAmount">+0G</div></div>
    <div class="loss-popup" id="lossPopup"><div style="font-size:14px;opacity:0.8;margin-bottom:8px;">ПРОГРАШ</div><div id="lossAmount">-0G</div></div>

    <script>
    let balance = 0, state = 'waiting', currentMult = 1.00, crashPoint = 0, myBet = 0, hasBet = false, flyInterval = null, historyList = [];
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');
    let chartPoints = [];

    function getParams() { const p = new URLSearchParams(window.location.search); return { uid: p.get('uid'), balance: parseFloat(p.get('balance') || '0') }; }
    function init() {
        const params = getParams();
        const localKey = params.uid ? `cr_balance_${params.uid}` : 'cr_balance_guest';
        balance = parseFloat(localStorage.getItem(localKey));
        if (isNaN(balance)) balance = params.balance || 1000;
        document.getElementById('balance').textContent = `🪙 ${balance.toFixed(2)}`;
    }
    function saveBalance() {
        const params = getParams();
        const localKey = params.uid ? `cr_balance_${params.uid}` : 'cr_balance_guest';
        localStorage.setItem(localKey, balance);
        document.getElementById('balance').textContent = `🪙 ${balance.toFixed(2)}`;
    }

    function halfBet() { const inp = document.getElementById('betInput'); inp.value = Math.max(1, Math.floor(inp.value / 2)); }
    function doubleBet() { const inp = document.getElementById('betInput'); inp.value = Math.min(balance, inp.value * 2); }

    function handleClick() {
        if (state === 'waiting') startRound();
        else if (state === 'flying' && hasBet) cashOut();
    }

    function startRound() {
        const bet = parseFloat(document.getElementById('betInput').value) || 10;
        if (bet > balance || bet <= 0) return;
        balance -= bet;
        saveBalance();
        myBet = bet; hasBet = true; state = 'betting';
        currentMult = 1.00;
        crashPoint = generateCrashPoint();
        chartPoints = [];
        document.getElementById('multiplier').textContent = '1.00x';
        document.getElementById('multiplier').className = 'multiplier-big';
        document.getElementById('status').textContent = 'Ставку прийнято...';
        document.getElementById('playBtn').className = 'play-btn';
        document.getElementById('playBtn').textContent = 'Очікування...';
        document.getElementById('playBtn').disabled = true;
        setTimeout(() => startFlying(), 2500);
    }

    function startFlying() {
        state = 'flying';
        document.getElementById('status').textContent = 'Раунд почався!';
        document.getElementById('playBtn').className = 'play-btn cashout';
        document.getElementById('playBtn').textContent = `Забрати ${currentMult.toFixed(2)}x`;
        document.getElementById('playBtn').disabled = false;

        flyInterval = setInterval(() => {
            currentMult += 0.01 + (currentMult - 1) * 0.012;
            currentMult = Math.round(currentMult * 100) / 100;
            document.getElementById('multiplier').textContent = `${currentMult.toFixed(2)}x`;
            if (hasBet) document.getElementById('playBtn').textContent = `Забрати ${currentMult.toFixed(2)}x`;
            chartPoints.push(currentMult);
            drawChart();
            const autoVal = parseFloat(document.getElementById('autoCashout').value) || 0;
            if (hasBet && autoVal > 0 && currentMult >= autoVal) { cashOut(); return; }
            if (currentMult >= crashPoint) { crash(); }
        }, 60);
    }

    function cashOut() {
        if (state !== 'flying' || !hasBet) return;
        clearInterval(flyInterval); state = 'waiting'; hasBet = false;
        const profit = Math.floor(myBet * currentMult);
        balance += profit;
        saveBalance();
        document.getElementById('multiplier').className = 'multiplier-big';
        document.getElementById('status').textContent = `Забрали на ${currentMult.toFixed(2)}x!`;
        document.getElementById('playBtn').className = 'play-btn';
        document.getElementById('playBtn').textContent = 'Зробити ставку';
        addToHistory(currentMult, true);
        showWin(profit - myBet);
        sendResult(myBet, profit - myBet);
    }

    function crash() {
        clearInterval(flyInterval); state = 'waiting'; hasBet = false;
        document.getElementById('multiplier').className = 'multiplier-big crashed';
        document.getElementById('status').textContent = `Крах на ${crashPoint.toFixed(2)}x!`;
        document.getElementById('playBtn').className = 'play-btn';
        document.getElementById('playBtn').textContent = 'Зробити ставку';
        addToHistory(crashPoint, false);
        if (myBet > 0) { showLoss(myBet); sendResult(myBet, -myBet); }
    }

    function generateCrashPoint() {
        const houseEdge = 0.04;
        const r = Math.random();
        if (r < houseEdge * 0.5) return 1.00;
        const crash = (1 - houseEdge) / (1 - r);
        return Math.max(1.00, Math.floor(crash * 100) / 100);
    }

    function drawChart() {
        canvas.width = canvas.offsetWidth * 2; canvas.height = canvas.offsetHeight * 2;
        ctx.scale(2, 2); ctx.clearRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);
        if (chartPoints.length < 2) return;
        const w = canvas.offsetWidth, h = canvas.offsetHeight;
        const maxVal = Math.max(...chartPoints, 2);
        const step = w / (chartPoints.length - 1);
        ctx.beginPath(); ctx.strokeStyle = '#00e676'; ctx.lineWidth = 2; ctx.shadowColor = '#00e676'; ctx.shadowBlur = 6;
        chartPoints.forEach((val, i) => { const x = i * step; const y = h - (val / maxVal) * (h - 10); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
        ctx.stroke(); ctx.shadowBlur = 0;
    }

    function addToHistory(mult, won) {
        historyList.unshift({ mult, won });
        if (historyList.length > 8) historyList.pop();
        const el = document.getElementById('history');
        el.innerHTML = historyList.map(h => `<div class="history-pill ${h.won ? 'win' : 'lose'}">${h.mult.toFixed(2)}x</div>`).join('');
    }

    function showWin(a) { const p = document.getElementById('winPopup'); document.getElementById('winAmount').textContent = `+${a}G`; p.className = 'win-popup show'; setTimeout(() => p.className = 'win-popup', 2000); }
    function showLoss(a) { const p = document.getElementById('lossPopup'); document.getElementById('lossAmount').textContent = `-${a}G`; p.className = 'loss-popup show'; setTimeout(() => p.className = 'loss-popup', 2000); }
    function sendResult(bet, profit) { const p = getParams(); if (!p.uid) return; const apiBase = p.api || window.location.origin; fetch(`${apiBase}/api/game-result`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ uid: p.uid, game: 'crash', bet, profit }) }).catch(() => {}); }

    init();
    </script>
</body>
</html>
