<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Слоти - Nironchik Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Inter',-apple-system,sans-serif;background:#0a0a1a;color:#fff;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}

        header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(10,10,26,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid rgba(255,255,255,0.06);z-index:10}
        .back-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);text-decoration:none}
        .back-btn:active{background:rgba(255,255,255,0.12)}
        .balance-chip{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:14px;background:rgba(255,193,7,0.06);border:0.5px solid rgba(255,193,7,0.1);font-weight:700;font-size:14px;color:#ffd54f}
        .gold-svg{width:16px;height:16px;flex-shrink:0}

        .game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at center,#12123a 0%,#0a0a1a 70%);overflow:hidden}
        .info-btn{position:absolute;top:12px;left:12px;z-index:10;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.5);cursor:pointer}

        .slot-machine{position:relative;width:280px;height:200px;background:linear-gradient(180deg,rgba(20,20,50,0.9),rgba(10,10,30,0.95));border:1px solid rgba(255,255,255,0.06);border-radius:16px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.04)}
        .slot-machine::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.04) 0%,transparent 50%);pointer-events:none;z-index:5}
        .reels-wrap{display:flex;height:100%;gap:4px;padding:8px}
        .reel{flex:1;position:relative;overflow:hidden;border-radius:10px;background:rgba(0,0,0,0.3)}
        .reel-strip{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;transition:top 0.1s linear}
        .reel-strip.spinning{transition:none}
        .reel-item{height:66.67px;display:flex;align-items:center;justify-content:center;font-size:48px;line-height:1}
        .reel-mask-top,.reel-mask-bottom{position:absolute;left:0;right:0;height:40px;pointer-events:none;z-index:3}
        .reel-mask-top{top:0;background:linear-gradient(to bottom,rgba(10,10,26,0.95),transparent)}
        .reel-mask-bottom{bottom:0;background:linear-gradient(to top,rgba(10,10,26,0.95),transparent)}
        .payline{position:absolute;top:50%;left:0;right:0;height:2px;transform:translateY(-50%);background:rgba(255,193,7,0.3);z-index:4;pointer-events:none}

        .win-display{height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;opacity:0;transition:opacity 0.3s}
        .win-display.show{opacity:1}
        .win-display.win{color:#ffd54f;text-shadow:0 0 20px rgba(255,193,7,0.4)}
        .win-display.lose{color:#ff5252}

        .controls{padding:12px 14px 16px;background:rgba(10,10,26,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:10px}
        .speed-row{display:flex;align-items:center;justify-content:flex-end;gap:8px}
        .speed-label{font-size:12px;font-weight:600;color:rgba(255,255,255,0.35);letter-spacing:0.5px;text-transform:uppercase}
        .toggle{width:40px;height:22px;border-radius:11px;background:rgba(255,255,255,0.1);border:none;position:relative;cursor:pointer;transition:background 0.25s}
        .toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 1px 4px rgba(0,0,0,0.3)}
        .toggle.on{background:linear-gradient(135deg,#7c4dff,#b388ff)}
        .toggle.on::after{transform:translateX(18px)}

        .bet-input-wrap{display:flex;align-items:center;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.08);border-radius:10px;padding:0 14px;height:44px}
        .bet-input-wrap input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:15px;font-weight:600;font-family:inherit}
        .bet-input-wrap input::placeholder{color:rgba(255,255,255,0.25)}

        .demo-row{display:flex;align-items:center;gap:8px}
        .demo-switch{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,0.1);border:none;position:relative;cursor:pointer;transition:background 0.25s}
        .demo-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 1px 4px rgba(0,0,0,0.3)}
        .demo-switch.on{background:linear-gradient(135deg,#7c4dff,#b388ff)}
        .demo-switch.on::after{transform:translateX(16px)}
        .demo-label{font-size:12px;color:rgba(255,255,255,0.4);font-weight:500}

        .quick-bets{display:flex;gap:6px}
        .quick-bet{flex:1;padding:8px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.5);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s}
        .quick-bet.active{background:rgba(255,193,7,0.1);color:#ffd54f;border-color:rgba(255,193,7,0.2)}
        .quick-bet:active{transform:scale(0.94)}

        .spin-btn{width:100%;height:50px;border-radius:12px;border:none;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#7c4dff,#b388ff);color:#fff;box-shadow:0 4px 20px rgba(124,77,255,0.3);transition:all 0.25s;letter-spacing:0.5px}
        .spin-btn:active{transform:scale(0.97)}
        .spin-btn:disabled{opacity:0.4;cursor:default}
        .spin-btn.win{background:linear-gradient(135deg,#00c853,#00e676);box-shadow:0 4px 20px rgba(0,200,83,0.3)}

        .slot-glow{position:absolute;width:200px;height:200px;border-radius:50%;filter:blur(80px);opacity:0;transition:opacity 0.5s;pointer-events:none}
        .slot-glow.gold{background:#ffc107;top:30%;left:50%;transform:translate(-50%,-50%)}
        .slot-glow.active{opacity:0.12}
    </style>
</head>
<body>

<header>
    <a href="../index.html" class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <div class="balance-chip"><span id="balance">---</span><svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg></div>
</header>

<svg style="position:absolute;width:0;height:0"><defs><linearGradient id="gGradGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe57f"/><stop offset=".5" stop-color="#ffc107"/><stop offset="1" stop-color="#ff8f00"/></linearGradient></defs></svg>

<div class="game-area">
    <button class="info-btn" onclick="alert('Слоти: 3 барабани, збирайте комбінації!\n\n🍒🍒🍒 = ×5\n🍋🍋🍋 = ×3\n🔔🔔🔔 = ×4\n⭐⭐⭐ = ×10\n💎💎💎 = ×20\n\n2 однакових = ×1.5')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
    <div class="slot-glow gold" id="glow"></div>
    <div class="slot-machine">
        <div class="reels-wrap" id="reelsWrap"></div>
        <div class="reel-mask-top"></div>
        <div class="reel-mask-bottom"></div>
        <div class="payline"></div>
    </div>
    <div class="win-display" id="winDisplay"></div>
</div>

<div class="controls">
    <div class="speed-row">
        <span class="speed-label">Швидкий</span>
        <button class="toggle" id="speedToggle" onclick="this.classList.toggle('on')"></button>
    </div>
    <div class="bet-input-wrap">
        <input type="number" id="betInput" placeholder="Сума ставки" value="15" min="1">
    </div>
    <div class="demo-row">
        <button class="demo-switch" id="demoSwitch" onclick="this.classList.toggle('on')"></button>
        <span class="demo-label">Демо-режим</span>
    </div>
    <div class="quick-bets">
        <button class="quick-bet active" onclick="quickBet(this,15)">15</button>
        <button class="quick-bet" onclick="quickBet(this,30)">30</button>
        <button class="quick-bet" onclick="quickBet(this,50)">50</button>
        <button class="quick-bet" onclick="quickBet(this,100)">100</button>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="spin()">КРУТИТЬ</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');
const API = (params.get('api') || window.location.origin) + '/api';
document.querySelector('.back-btn').href = '../index.html?' + params.toString();

const SYMBOLS = ['🍒','🍋','🔔','⭐','💎','7️⃣'];
const PAYOUTS = {
    '🍒🍒🍒': 5, '🍋🍋🍋': 3, '🔔🔔🔔': 4, '⭐⭐⭐': 10, '💎💎💎': 20, '7️⃣7️⃣7️⃣': 50,
    '🍒🍒': 1.5, '🍋🍋': 1.5, '🔔🔔': 1.5, '⭐⭐': 1.5, '💎💎': 1.5, '7️⃣7️⃣': 1.5
};
const STRIP_LENGTH = 30;
let balance = 0, spinning = false, reels = [];

function loadBalance() {
    const k = uid ? `sl_balance_${uid}` : 'sl_balance_guest';
    if (uid) {
        fetch(`${API}/balance/${uid}`).then(r=>r.json()).then(d=>{
            balance = d.balance||0; document.getElementById('balance').textContent = balance.toFixed(2);
        }).catch(()=>{ balance = parseFloat(localStorage.getItem(k))||1000; document.getElementById('balance').textContent = balance.toFixed(2); });
    } else { balance = parseFloat(localStorage.getItem(k))||1000; document.getElementById('balance').textContent = balance.toFixed(2); }
}
function saveBalance() {
    const k = uid ? `sl_balance_${uid}` : 'sl_balance_guest';
    localStorage.setItem(k, balance);
    document.getElementById('balance').textContent = balance.toFixed(2);
}

function initReels() {
    const wrap = document.getElementById('reelsWrap');
    wrap.innerHTML = '';
    reels = [];
    for (let r = 0; r < 3; r++) {
        const reel = document.createElement('div');
        reel.className = 'reel';
        const strip = document.createElement('div');
        strip.className = 'reel-strip';
        strip.style.top = '0px';
        for (let i = 0; i < STRIP_LENGTH; i++) {
            const item = document.createElement('div');
            item.className = 'reel-item';
            item.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
            strip.appendChild(item);
        }
        reel.appendChild(strip);
        wrap.appendChild(reel);
        reels.push({ el: strip, items: strip.children, pos: 0 });
    }
}

function quickBet(btn, val) {
    document.querySelectorAll('.quick-bet').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('betInput').value = val;
}

function spin() {
    if (spinning) return;
    const bet = parseInt(document.getElementById('betInput').value)||0;
    if (bet <= 0) return alert('Введіть суму ставки');
    const isDemo = document.getElementById('demoSwitch').classList.contains('on');
    const fast = document.getElementById('speedToggle').classList.contains('on');
    if (!isDemo && bet > balance) return alert('Недостатньо голди!');
    if (!isDemo) { balance -= bet; saveBalance(); }

    spinning = true;
    const btn = document.getElementById('spinBtn');
    btn.disabled = true;
    btn.className = 'spin-btn';
    document.getElementById('winDisplay').className = 'win-display';
    document.getElementById('glow').classList.remove('active');

    // Determine results
    const results = [];
    for (let r = 0; r < 3; r++) {
        const idx = Math.floor(Math.random() * SYMBOLS.length);
        results.push(idx);
    }

    // Generate strips with results at the end
    const itemH = 66.67;
    const promises = reels.map((reel, r) => {
        return new Promise(resolve => {
            // Reset strip
            const items = [];
            for (let i = 0; i < STRIP_LENGTH; i++) {
                items.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
            }
            // Place result at final position
            items[STRIP_LENGTH - 2] = SYMBOLS[results[r]];

            reel.el.innerHTML = '';
            items.forEach(s => {
                const d = document.createElement('div');
                d.className = 'reel-item';
                d.textContent = s;
                reel.el.appendChild(d);
            });

            reel.el.classList.add('spinning');
            reel.el.style.top = '0px';

            const targetIdx = STRIP_LENGTH - 2;
            const targetTop = -(targetIdx * itemH);
            const totalDist = Math.abs(targetTop) + 200;
            const duration = fast ? 600 + r * 200 : 1200 + r * 400;
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // Ease out
                const eased = 1 - Math.pow(1 - progress, 3);
                const currentTop = -eased * (Math.abs(targetTop) + 100);
                reel.el.style.top = currentTop + 'px';

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    reel.el.classList.remove('spinning');
                    reel.el.style.top = targetTop + 'px';
                    reel.el.innerHTML = '';
                    // Rebuild with visible items
                    for (let i = targetIdx - 1; i <= targetIdx + 1; i++) {
                        const d = document.createElement('div');
                        d.className = 'reel-item';
                        d.textContent = items[Math.max(0, Math.min(items.length-1, i))];
                        reel.el.appendChild(d);
                    }
                    reel.el.style.top = '-' + itemH + 'px';
                    resolve();
                }
            }
            requestAnimationFrame(animate);
        });
    });

    Promise.all(promises).then(() => {
        spinning = false;
        btn.disabled = false;

        // Check win
        const s = results.map(i => SYMBOLS[i]);
        let winMult = 0;
        if (s[0] === s[1] && s[1] === s[2]) {
            winMult = PAYOUTS[s.join('')] || 2;
        } else if (s[0] === s[1] || s[1] === s[2] || s[0] === s[2]) {
            winMult = 1.5;
        }

        const wd = document.getElementById('winDisplay');
        if (winMult > 0) {
            const winAmount = Math.floor(bet * winMult);
            wd.textContent = `Виграш: ${winAmount}г (×${winMult})`;
            wd.className = 'win-display show win';
            btn.className = 'spin-btn win';
            document.getElementById('glow').classList.add('active');
            if (!isDemo) { balance += winAmount; saveBalance(); }
        } else {
            wd.textContent = `Програш: -${bet}г`;
            wd.className = 'win-display show lose';
        }

        if (!isDemo && uid) {
            fetch(`${API}/game-result`, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({uid, game:'slots', bet, profit: winMult > 0 ? Math.floor(bet * winMult) - bet : -bet})
            }).catch(()=>{});
        }
    });
}

loadBalance();
initReels();
</script>
</body>
</html>
