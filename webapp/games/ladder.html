<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Драбина - Nironchik Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Inter',-apple-system,sans-serif;background:#070714;color:#fff;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}

        header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(7,7,20,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid rgba(255,255,255,0.06);z-index:10}
        .back-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);text-decoration:none}
        .back-btn:active{background:rgba(255,255,255,0.12)}
        .title{font-size:16px;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,#ffd54f,#ff8f00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .h-right{display:flex;align-items:center;gap:8px}
        .info-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);cursor:pointer}
        .balance-chip{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:14px;background:rgba(255,193,7,0.06);border:0.5px solid rgba(255,193,7,0.1);font-weight:700;font-size:14px;color:#ffd54f}
        .gold-svg{width:16px;height:16px;flex-shrink:0}

        .max-win{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;margin:8px 14px;border-radius:10px;background:rgba(255,193,7,0.05);border:0.5px solid rgba(255,193,7,0.08);font-size:12px;font-weight:600;color:rgba(255,255,255,0.4)}
        .max-win span{color:#ffd54f;font-weight:800}

        .board-area{flex:1;display:flex;align-items:center;justify-content:center;padding:0 10px;overflow:hidden}
        .ladder{position:relative;display:flex;flex-direction:column-reverse;gap:4px;width:100%;max-width:300px}
        .lrung{display:flex;align-items:center;gap:6px;height:36px}
        .rung-num{width:22px;text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,0.2);flex-shrink:0}
        .rung-num.active{color:#ffd54f}
        .rung-bar{flex:1;height:100%;border-radius:6px;display:flex;overflow:hidden;gap:2px}
        .rung-half{flex:1;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;font-size:12px;font-weight:700;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.25)}
        .rung-half.green{background:rgba(0,230,118,0.12)!important;border-color:rgba(0,230,118,0.2)!important;color:#00e676}
        .rung-half.red{background:rgba(255,23,68,0.12)!important;border-color:rgba(255,23,68,0.2)!important;color:#ff5252}
        .rung-half.pickable{background:rgba(255,255,255,0.07)!important;border-color:rgba(255,255,255,0.1)!important;color:rgba(255,255,255,0.5);cursor:pointer}
        .rung-half.pickable:hover{background:rgba(255,255,255,0.12)!important;color:#fff}
        .rung-half.locked{pointer-events:none}
        .rung-mult{position:absolute;font-size:9px;font-weight:700}

        .controls{padding:10px 14px 14px;background:rgba(7,7,20,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:10px}
        .ctrl-top{display:flex;align-items:flex-end;gap:10px}
        .input-grp{flex:1;display:flex;flex-direction:column;gap:4px}
        .label{font-size:11px;font-weight:600;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.5px}
        .input-box{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.08);border-radius:8px;padding:0 10px;height:38px}
        .input-box input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14px;font-weight:600;font-family:inherit}

        .risk-btns{display:flex;gap:4px}
        .risk-btn{width:36px;height:36px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s}
        .risk-btn.on{background:rgba(255,193,7,0.12);color:#ffd54f;border-color:rgba(255,193,7,0.2)}

        .demo-row{display:flex;align-items:center;gap:8px}
        .demo-switch{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,0.1);border:none;position:relative;cursor:pointer;transition:background 0.25s}
        .demo-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 1px 4px rgba(0,0,0,0.3)}
        .demo-switch.on{background:linear-gradient(135deg,#7c4dff,#b388ff)}
        .demo-switch.on::after{transform:translateX(16px)}
        .demo-label{font-size:12px;color:rgba(255,255,255,0.4);font-weight:500}

        .action-btn{width:100%;height:48px;border-radius:10px;border:none;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.25s;letter-spacing:0.5px}
        .action-btn.play{background:linear-gradient(135deg,#00c853,#00e676);color:#003d00;box-shadow:0 4px 16px rgba(0,200,83,0.3)}
        .action-btn.play:active{transform:scale(0.97)}
        .action-btn.cashout{background:linear-gradient(135deg,#ff6d00,#ff9100);color:#3d1500;box-shadow:0 4px 16px rgba(255,109,0,0.3);animation:coPulse 1s infinite}
        @keyframes coPulse{0%,100%{box-shadow:0 4px 16px rgba(255,109,0,0.3)}50%{box-shadow:0 4px 24px rgba(255,109,0,0.5)}}
        .action-btn:disabled{opacity:0.4;cursor:default;animation:none}
        .status{text-align:center;font-size:13px;font-weight:600;padding:2px 0;color:rgba(255,255,255,0.35);min-height:20px}
        .status.win{color:#00e676}
        .status.lose{color:#ff5252}
    </style>
</head>
<body>

<header>
    <a href="../index.html" class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <div class="title">ДРАБИНА</div>
    <div class="h-right">
        <button class="info-btn" onclick="alert('Драбина: 10 сходинок.\nНа кожній сходинці 2 варіанти: правильний і неправильний.\nОберіть правильний — піднімаєтесь вище.\nМножник зростає з кожним рівнем.')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
        <div class="balance-chip"><span id="balance">---</span><svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg></div>
    </div>
</header>

<svg style="position:absolute;width:0;height:0"><defs><linearGradient id="gGradGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe57f"/><stop offset=".5" stop-color="#ffc107"/><stop offset="1" stop-color="#ff8f00"/></linearGradient></defs></svg>

<div class="max-win">МАКСИМАЛЬНИЙ ВИГРАШ: <span id="maxWin">512</span><svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg></div>

<div class="board-area"><div class="ladder" id="ladder"></div></div>

<div class="controls">
    <div class="status" id="status"></div>
    <div class="ctrl-top">
        <div class="input-grp">
            <span class="label">Ставка</span>
            <div class="input-box">
                <svg class="gold-svg" viewBox="0 0 100 100"><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="#7a4200" stroke-width="24" stroke-linecap="round"/><path d="M77.3 27.1A35.5 35.5 0 1 0 85.5 50L59.9 50" fill="none" stroke="url(#gGradGold)" stroke-width="17" stroke-linecap="round"/></svg>
                <input type="number" id="betInput" value="15" min="1">
            </div>
        </div>
        <div class="input-grp" style="flex:0.5">
            <span class="label">Ризик</span>
            <div class="risk-btns">
                <button class="risk-btn on" onclick="setRisk(0)">Н</button>
                <button class="risk-btn" onclick="setRisk(1)">С</button>
                <button class="risk-btn" onclick="setRisk(2)">В</button>
            </div>
        </div>
    </div>
    <div class="demo-row">
        <button class="demo-switch" id="demoSwitch" onclick="this.classList.toggle('on')"></button>
        <span class="demo-label">Демо-режим</span>
    </div>
    <button class="action-btn play" id="actionBtn" onclick="handleAction()">ГРАТИ</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');
const API = (params.get('api') || window.location.origin) + '/api';

const RUNGS = 10;
// House edge ~4%: fair mult = (1-0.04)/0.5 = 1.92 → we give ~1.80-1.95
const MULTS = [1.18,1.40,1.67,2.00,2.40,2.88,3.46,4.15,4.98,5.97];
const RISK_NAMES = ['Низький','Середній','Високий'];
let balance = 0, phase = 'idle', risk = 0, ladder = [], currentRung = 0, bet = 0;

function loadBalance() {
    const k = uid ? `ld_balance_${uid}` : 'ld_balance_guest';
    if (uid) {
        fetch(`${API}/balance/${uid}`).then(r=>r.json()).then(d=>{
            balance = d.balance||0; updateBal();
        }).catch(()=>{ balance = parseFloat(localStorage.getItem(k))||1000; updateBal(); });
    } else { balance = parseFloat(localStorage.getItem(k))||1000; updateBal(); }
}
function saveBalance() {
    const k = uid ? `ld_balance_${uid}` : 'ld_balance_guest';
    localStorage.setItem(k, balance); updateBal();
}
function updateBal() { document.getElementById('balance').textContent = balance.toFixed(2); }

function setRisk(r) {
    if (phase !== 'idle') return;
    risk = r;
    document.querySelectorAll('.risk-btn').forEach((b,i) => b.className = i === r ? 'risk-btn on' : 'risk-btn');
}

function buildLadder() {
    const el = document.getElementById('ladder');
    el.innerHTML = '';
    ladder = [];
    for (let i = 0; i < RUNGS; i++) {
        const correct = Math.random() < 0.5 ? 0 : 1;
        const rung = document.createElement('div');
        rung.className = 'lrung' + (i === 0 ? ' active' : '');
        rung.innerHTML = `<span class="rung-num">${i+1}</span><div class="rung-bar"><button class="rung-half" data-rung="${i}" data-side="0"></button><button class="rung-half" data-rung="${i}" data-side="1"></button></div>`;
        el.appendChild(rung);
        ladder.push({ correct });
    }
    // Reveal lowest risk level
    revealRung(0, risk);
}

function revealRung(rungIdx, riskLvl) {
    if (rungIdx >= RUNGS) return;
    const rung = document.querySelectorAll('.lrung')[rungIdx];
    const halves = rung.querySelectorAll('.rung-half');
    const correct = ladder[rungIdx].correct;
    const incorrect = 1 - correct;

    // Determine which side to show
    let showSides;
    if (riskLvl === 0) { // Low risk: show only correct side as correct
        showSides = [correct, incorrect];
    } else if (riskLvl === 1) { // Medium: random
        showSides = [correct, incorrect];
    } else { // High: sometimes show incorrect as correct (fake)
        const fake = Math.random() < 0.3;
        if (fake) showSides = [incorrect, correct];
        else showSides = [correct, incorrect];
    }

    halves[0].textContent = '↑';
    halves[1].textContent = '↑';
    halves[0].onclick = () => pickSide(rungIdx, 0);
    halves[1].onclick = () => pickSide(rungIdx, 1);
    if (rungIdx === currentRung) {
        halves[0].className = 'rung-half pickable';
        halves[1].className = 'rung-half pickable';
    }
}

function pickSide(rungIdx, side) {
    if (phase !== 'playing' || rungIdx !== currentRung) return;
    const halves = document.querySelectorAll(`.lrung:nth-child(${rungIdx + 1}) .rung-half`);
    const correct = ladder[rungIdx].correct;

    // High risk: sometimes lie
    let isCorrect = side === correct;
    if (risk === 2 && Math.random() < 0.3) isCorrect = !isCorrect;

    halves[0].classList.add('locked');
    halves[1].classList.add('locked');

    if (isCorrect) {
        halves[side].className = 'rung-half green locked';
        halves[1 - side].className = 'rung-half red locked';
        currentRung++;

        if (currentRung >= RUNGS) {
            gameEnd(true);
        } else {
            const mult = getMult();
            document.getElementById('status').textContent = `Сходинка ${currentRung}/${RUNGS} — ×${mult[currentRung-1].toFixed(2)}`;
            document.querySelectorAll('.lrung')[currentRung].className = 'lrung active';
            document.querySelectorAll('.lrung')[rungIdx].className = 'lrung';
            revealRung(currentRung, risk);
        }
    } else {
        halves[side].className = 'rung-half red locked';
        halves[1 - side].className = 'rung-half green locked';
        gameEnd(false);
    }
}

function getMult() { return MULTS; }

function gameEnd(won) {
    phase = 'ended';
    const mult = getMult();
    const winAmount = won ? Math.floor(bet * mult[RUNS - 1]) : 0;
    const isDemo = document.getElementById('demoSwitch').classList.contains('on');

    // Lock all
    document.querySelectorAll('.lrung').forEach(r => {
        r.className = 'lrung';
        r.querySelectorAll('.rung-half').forEach(h => h.className = 'rung-half locked');
    });

    if (won) {
        document.getElementById('status').textContent = `Виграш: ${winAmount}г (×${mult[RUNS - 1].toFixed(2)})`;
        document.getElementById('status').className = 'status win';
    } else {
        document.getElementById('status').textContent = 'Неправильно! Ви програли';
        document.getElementById('status').className = 'status lose';
    }

    if (!isDemo && bet > 0) {
        if (uid) {
            fetch(`${API}/game-result`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({uid, game:'ladder', bet, profit: winAmount - bet})
            }).catch(()=>{});
            loadBalance();
        } else {
            balance += winAmount - bet;
            saveBalance();
        }
    }

    const btn = document.getElementById('actionBtn');
    btn.className = 'action-btn play';
    btn.textContent = 'НОВА ГРА';
    btn.disabled = false;
}

function handleAction() {
    if (phase === 'idle' || phase === 'ended') {
        bet = parseInt(document.getElementById('betInput').value) || 0;
        if (bet <= 0) return alert('Введіть суму ставки');
        const isDemo = document.getElementById('demoSwitch').classList.contains('on');
        if (!isDemo && bet > balance) return alert('Недостатньо голди!');
        if (!isDemo) { balance -= bet; saveBalance(); }
        phase = 'playing';
        currentRung = 0;
        document.getElementById('status').textContent = `Сходинка 1/${RUNGS} — оберіть напрям`;
        document.getElementById('status').className = 'status';
        buildLadder();
        const btn = document.getElementById('actionBtn');
        btn.className = 'action-btn cashout';
        btn.textContent = 'ЗАБРАТИ';
        btn.onclick = cashOut;
    }
}

function cashOut() {
    if (phase !== 'playing' || currentRung === 0) return;
    const mult = getMult();
    const win = Math.floor(bet * mult[currentRung - 1]);
    phase = 'ended';
    document.getElementById('status').textContent = `Забрано: ${win}г (×${mult[currentRung - 1].toFixed(2)})`;
    document.getElementById('status').className = 'status win';

    const isDemo = document.getElementById('demoSwitch').classList.contains('on');
    if (!isDemo) {
        if (uid) {
            fetch(`${API}/game-result`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({uid, game:'ladder', bet, profit: win - bet})
            }).catch(()=>{});
            loadBalance();
        } else {
            balance += win;
            saveBalance();
        }
    }

    document.querySelectorAll('.lrung').forEach(r => {
        r.className = 'lrung';
        r.querySelectorAll('.rung-half').forEach(h => h.className = 'rung-half locked');
    });

    const btn = document.getElementById('actionBtn');
    btn.className = 'action-btn play';
    btn.textContent = 'НОВА ГРА';
    btn.onclick = handleAction;
}

loadBalance();
buildLadder();
</script>
</body>
</html>
