<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nironchik Shop - Ігри</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #070714;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* ─── Header ─── */
        .header {
            position: sticky; top: 0; z-index: 100;
            padding: 14px 16px;
            display: flex; align-items: center; gap: 12px;
            background: rgba(7, 7, 20, 0.85);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .user-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, #1a1a3e, #2a2a5e);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0; overflow: hidden;
            border: 2px solid rgba(255,193,7,0.25);
            box-shadow: 0 0 12px rgba(255,193,7,0.15);
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info { flex: 1; min-width: 0; }
        .user-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
        .user-id { font-size: 11px; color: rgba(255,255,255,0.35); }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .balance-chip {
            display: flex; align-items: center; gap: 5px;
            background: rgba(255,193,7,0.08);
            border: 1px solid rgba(255,193,7,0.18);
            padding: 7px 14px; border-radius: 22px;
            font-weight: 700; font-size: 14px; color: #ffd54f;
        }
        .coin-icon {
            width: 18px; height: 18px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffe082, #ffb300, #ff8f00);
            box-shadow: 0 0 6px rgba(255,179,0,0.5), inset 0 -1px 2px rgba(0,0,0,0.3);
            flex-shrink: 0; position: relative;
        }
        .coin-icon::after {
            content: 'G'; position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 800; color: #7c5c00;
        }
        .plus-btn {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, #00c853, #00e676);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 700; color: #fff; cursor: pointer;
            text-decoration: none; box-shadow: 0 2px 12px rgba(0,200,83,0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .plus-btn:active { transform: scale(0.9); }

        /* ─── LIVE Feed ─── */
        .live-section { padding: 14px 0 6px; overflow: hidden; position: relative; }
        .live-section::before, .live-section::after {
            content: ''; position: absolute; top: 0; bottom: 0; width: 32px; z-index: 2; pointer-events: none;
        }
        .live-section::before { left: 0; background: linear-gradient(to right, #070714, transparent); }
        .live-section::after  { right: 0; background: linear-gradient(to left, #070714, transparent); }
        .live-badge {
            display: inline-flex; align-items: center; gap: 6px;
            margin-left: 16px; margin-bottom: 10px;
            background: rgba(0,200,83,0.1); border: 1px solid rgba(0,200,83,0.2);
            padding: 4px 12px; border-radius: 14px;
            font-size: 11px; font-weight: 700; color: #00e676; letter-spacing: 0.5px;
        }
        .live-dot {
            width: 6px; height: 6px; border-radius: 50%; background: #00e676;
            animation: livePulse 1.5s ease-in-out infinite;
        }
        @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }
        .feed-wrap { position: relative; }
        .feed-track {
            display: flex; gap: 8px; padding-left: 16px;
            animation: feedScroll 30s linear infinite;
            width: max-content;
        }
        .feed-track:hover { animation-play-state: paused; }
        @keyframes feedScroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
        .feed-pill {
            display: flex; align-items: center; gap: 7px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 6px 14px 6px 8px; border-radius: 20px;
            white-space: nowrap; font-size: 12px; flex-shrink: 0;
            transition: background 0.2s;
        }
        .feed-pill:hover { background: rgba(255,255,255,0.07); }
        .feed-avatar {
            width: 22px; height: 22px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; flex-shrink: 0; overflow: hidden;
        }
        .feed-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .feed-name { color: rgba(255,255,255,0.55); }
        .feed-amount { color: #00e676; font-weight: 700; }

        /* ─── Games Grid ─── */
        .section-title {
            padding: 20px 16px 12px;
            font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.35);
            letter-spacing: 1px; text-transform: uppercase;
        }
        .games-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 12px; padding: 0 16px;
        }
        .game-card {
            position: relative; border-radius: 18px; overflow: hidden;
            text-decoration: none; color: #fff;
            aspect-ratio: 0.78;
            display: flex; flex-direction: column; justify-content: flex-end;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .game-card:active { transform: scale(0.95); }
        .game-card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
        .game-card-img {
            position: absolute; inset: 0; z-index: 0;
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
        }
        .game-card:hover .game-card-img { transform: scale(1.06); }
        .game-card-overlay {
            position: absolute; inset: 0; z-index: 1;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0) 65%);
        }
        .game-card-content {
            position: relative; z-index: 2;
            padding: 14px; display: flex; align-items: flex-end; justify-content: space-between;
        }
        .game-card h3 {
            font-size: 15px; font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        .game-card-arrow {
            width: 30px; height: 30px; border-radius: 50%;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; flex-shrink: 0;
            transition: background 0.2s, transform 0.2s;
        }
        .game-card:hover .game-card-arrow { background: rgba(255,255,255,0.2); transform: translateX(2px); }
        .new-badge {
            position: absolute; top: 10px; left: 10px; z-index: 3;
            background: linear-gradient(135deg, #ff1744, #d50000);
            color: #fff; font-size: 9px; font-weight: 800;
            padding: 3px 9px; border-radius: 7px;
            letter-spacing: 0.6px; text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(255,23,68,0.4);
        }

        /* ─── Liquid Glass Bottom Nav (iOS style) ─── */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .nav-glass {
            position: relative;
            display: flex; justify-content: space-around; align-items: stretch;
            background: linear-gradient(
                180deg,
                rgba(60, 60, 90, 0.35) 0%,
                rgba(30, 30, 55, 0.55) 40%,
                rgba(20, 20, 45, 0.7) 100%
            );
            backdrop-filter: blur(50px) saturate(180%) brightness(1.05);
            -webkit-backdrop-filter: blur(50px) saturate(180%) brightness(1.05);
            border-top: 0.5px solid rgba(255,255,255,0.12);
            padding: 6px 0 8px;
        }
        .nav-glass::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 0.5px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        }
        .nav-glass::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 50%);
            pointer-events: none;
        }
        .nav-item {
            flex: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            text-decoration: none; color: rgba(255,255,255,0.3);
            font-size: 10px; font-weight: 500; letter-spacing: 0.2px;
            padding: 6px 0;
            position: relative; z-index: 1;
            transition: color 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-item.active { color: #7c4dff; }
        .nav-item.active::before {
            content: '';
            position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
            width: 48px; height: 3px; border-radius: 2px;
            background: linear-gradient(90deg, #7c4dff, #b388ff);
            box-shadow: 0 0 12px rgba(124,77,255,0.5), 0 0 24px rgba(124,77,255,0.2);
            animation: tabIndicator 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes tabIndicator {
            from { width: 0; opacity: 0; }
            to   { width: 48px; opacity: 1; }
        }
        .nav-item:not(.active):active { opacity: 0.6; }
        .nav-icon {
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 1px;
        }
        .nav-icon svg { width: 22px; height: 22px; fill: currentColor; transition: transform 0.25s ease; }
        .nav-item.active .nav-icon svg { transform: scale(1.1); }

        /* ─── Animations ─── */
        .fade-in {
            animation: fadeIn 0.5s ease both;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .game-card { animation: cardPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
        @keyframes cardPop {
            from { opacity: 0; transform: scale(0.88) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.10s; }
        .stagger-3 { animation-delay: 0.15s; }
        .stagger-4 { animation-delay: 0.20s; }
        .stagger-5 { animation-delay: 0.25s; }
        .stagger-6 { animation-delay: 0.30s; }
        .stagger-7 { animation-delay: 0.35s; }
        .stagger-8 { animation-delay: 0.40s; }
        .stagger-9 { animation-delay: 0.45s; }
        .stagger-10 { animation-delay: 0.50s; }

        /* ─── Pull-to-refresh indicator ─── */
        .loader {
            display: none; text-align: center; padding: 40px;
            color: rgba(255,255,255,0.3); font-size: 13px;
        }
        .loader.active { display: block; }
        .loader-spinner {
            width: 28px; height: 28px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.08);
            border-top-color: #7c4dff;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Safe area ─── */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            body { padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header fade-in">
    <div class="user-avatar" id="avatar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="rgba(255,255,255,0.3)"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </div>
    <div class="user-info">
        <div class="user-name" id="userName">Завантаження...</div>
        <div class="user-id" id="userID"></div>
    </div>
    <div class="header-right">
        <div class="balance-chip">
            <span id="balance">---</span>
            <div class="coin-icon"></div>
        </div>
        <a class="plus-btn" id="plusBtn" href="#">+</a>
    </div>
</div>

<!-- LIVE Feed -->
<div class="live-section fade-in" style="animation-delay:0.1s">
    <div class="live-badge"><span class="live-dot"></span> LIVE</div>
    <div class="feed-wrap">
        <div class="feed-track" id="feedTrack"></div>
    </div>
</div>

<!-- Games -->
<div class="section-title fade-in" style="animation-delay:0.15s">Ігри</div>
<div class="games-grid" id="gamesGrid"></div>

<!-- Bottom Nav — Liquid Glass -->
<div class="bottom-nav">
    <div class="nav-glass">
        <a href="index.html" class="nav-item active">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24"><path d="M21 6H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1zm-1 10H4V8h16v8zM6 10h2v4H6zm3 0h2v4H9zm3 0h2v4h-2zm3 0h2v4h-2z"/></svg>
            </span>
            <span>Ігри</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </span>
            <span>Профіль</span>
        </a>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');
const username = params.get('username') || 'Гравець';
const avatarUrl = params.get('avatar') || '';

const GAMES = [
    { id:'rocket',   name:'Ракета',        img:'assets/games/rocket.webp',   color:'#1a3a5c' },
    { id:'crash',    name:'Краш',           img:'assets/games/crash.webp',    color:'#0d2844' },
    { id:'miner',    name:'Мінер',          img:'assets/games/miner.webp',    color:'#5c1a1a' },
    { id:'plinko',   name:'Плинко',         img:'assets/games/plinko.webp',   color:'#2d1a5c' },
    { id:'coinflip', name:'Орел/Решка',     img:'assets/games/coinflip.webp', color:'#5c4a0a' },
    { id:'slots',    name:'Слоти',          img:'assets/games/slots.webp',    color:'#4a0a0a' },
    { id:'ladder',   name:'Лесенка',        img:'assets/games/ladder.webp',   color:'#0a3a4a' },
    { id:'tower',    name:'Башня',          img:'assets/games/tower.webp',    color:'#4a3a0a', isNew:true },
    { id:'cups',     name:'Стаканчики',     img:'assets/games/cupsnew.webp',  color:'#4a3a0a', isNew:true },
    { id:'dice',     name:'Більше/Менше',   img:'assets/games/dice.webp',     color:'#0a3a2a', isNew:true },
];

const FEED_NAMES = ['Анонім','Oleksii','Віктор','Діма','Максим','Андрій','Олексій','Роман','Тарас','Богдан','Саша','Zefirka'];
const AVATARS_COLORS = ['#667eea','#764ba2','#f093fb','#f5576c','#4facfe','#00f2fe','#43e97b','#fa709a','#fee140','#a18cd1'];

function initHeader() {
    document.getElementById('userID').textContent = `ID: ${uid || '---'}`;
    document.getElementById('userName').textContent = username;
    if (avatarUrl) {
        document.getElementById('avatar').innerHTML = `<img src="${avatarUrl}" alt="">`;
    }
    document.getElementById('plusBtn').href = uid ? `https://t.me/NironchikShopBot?start=buy` : '#';
    loadBalance();
}

function loadBalance() {
    if (!uid) return;
    document.getElementById('balance').textContent = '...';
    fetch(`/api/balance/${uid}`).then(r=>r.json()).then(d=>{
        document.getElementById('balance').textContent = (d.balance||0).toFixed(2);
    }).catch(()=>{
        document.getElementById('balance').textContent = '---';
    });
}

function initFeed() {
    const track = document.getElementById('feedTrack');
    let html = '';
    for (let i = 0; i < 50; i++) {
        const name = FEED_NAMES[Math.floor(Math.random()*FEED_NAMES.length)];
        const amount = Math.floor(Math.random()*2000)+10;
        const color = AVATARS_COLORS[Math.floor(Math.random()*AVATARS_COLORS.length)];
        const initial = name[0].toUpperCase();
        html += `<div class="feed-pill">
            <div class="feed-avatar" style="background:${color}">${initial}</div>
            <span class="feed-name">${name}</span>
            <span class="feed-amount">+${amount.toLocaleString()}</span>
        </div>`;
    }
    track.innerHTML = html + html;
}

function initGames() {
    const grid = document.getElementById('gamesGrid');
    GAMES.forEach((game, i) => {
        const card = document.createElement('a');
        card.className = `game-card stagger-${i+1}`;
        card.href = `games/${game.id}.html?uid=${uid}&balance=${document.getElementById('balance').textContent}`;
        card.innerHTML = `
            <img class="game-card-img" src="${game.img}" alt="${game.name}"
                 onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(135deg,${game.color},${game.color}dd)'">
            <div class="game-card-overlay"></div>
            ${game.isNew ? '<div class="new-badge">НОВА</div>' : ''}
            <div class="game-card-content">
                <h3>${game.name}</h3>
                <div class="game-card-arrow">→</div>
            </div>
        `;
        grid.appendChild(card);
    });
}

initHeader();
initFeed();
initGames();
</script>
</body>
</html>
